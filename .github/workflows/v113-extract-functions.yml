name: v113 inspect receipt functions
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v113-extract-functions.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print receipt function neighborhoods
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['reportReceiptNumber','quickReceipt','recentPaymentReceipt','issueReceipt']:
              print('\n===== '+term+' =====')
              pos=[]; start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  pos.append(i); start=i+len(term)
              print('positions',pos)
              for i in pos[-3:]:
                  print('\n---',i,'---\n',s[max(0,i-500):i+1800])
          PY
