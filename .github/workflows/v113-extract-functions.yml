name: v113 extract exact receipt functions
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v113-extract-functions.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact functions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          keys=['reportReceiptNumber(s){','quickReceipt(s){','recentPaymentReceipt(p){','async issueReceipt(){']
          out=[]
          for k in keys:
              i=s.find(k); out.append('\n===== '+k+' =====\n')
              assert i>=0, k
              # compact window enough to next methods
              out.append(s[i:i+4200])
          Path('v113-functions.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v113-functions.txt
          git commit -m 'v113: capture exact receipt functions'
          git push
