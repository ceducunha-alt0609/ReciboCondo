name: v116 exact receipt deletion
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v116-audit-receipt-removal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace exact legacy receipt deletion restriction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old=Path('v116-exact-removeReceiptInternal.txt').read_text(encoding='utf-8')
          assert s.count(old)==1, f'exact function count={s.count(old)}'
          new="""async removeReceiptInternal(id){let r=this.receipts.find(x=>Number(x.id)===Number(id));if(!r)return;await db.transaction('rw',db.receipts,db.payments,async()=>{await db.receipts.delete(id);let ps=this.payments.filter(p=>Number(p.receiptId)===Number(id)||Number(p.id)===Number(r.paymentId));for(const p of ps){if(Number(p.receiptId)===Number(id))await db.payments.update(p.id,{receiptId:null})}});if(this.currentReceipt&&Number(this.currentReceipt.id)===Number(id))this.currentReceipt=null;await this.logAction('delete','Recibo excluído; pagamento preservado','Nº '+(r.number||'-')+' • '+(r.providerName||this.providerName(r.providerId))+' • '+this.money(r.total||0));await this.load();this.toast('Recibo nº '+(r.number||'-')+' excluído. O pagamento correspondente foi preservado e pode receber novo recibo.')}"""
          s=s.replace(old,new,1)
          assert 'somente o recibo mais recente deste lançamento pode ser excluído' not in s
          assert 'Recibo excluído; pagamento preservado' in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v116-exact-receipt-deletion'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v116-audit-receipt-removal.yml v116-exact-removeReceiptInternal.txt
          git commit -m 'v116: allow exact receipt deletion safely'
          git push
