name: v116 inspect exact receipt removal
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v116-audit-receipt-removal.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact function body by brace balance
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='async removeReceiptInternal(id){'
          start=s.find(marker); assert start>=0
          brace=s.find('{',start); depth=0; quote=None; esc=False; end=None
          for i in range(brace,len(s)):
              ch=s[i]
              if quote:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch==quote: quote=None
                  continue
              if ch in "'\"`": quote=ch; continue
              if ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          assert end
          body=s[start:end]
          Path('v116-exact-removeReceiptInternal.txt').write_text(body,encoding='utf-8')
          print(body)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v116-exact-removeReceiptInternal.txt
          git commit -m 'v116: capture exact receipt removal function'
          git push
