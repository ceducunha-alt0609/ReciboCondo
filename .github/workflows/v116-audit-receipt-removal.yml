name: v116 receipt deletion safety retry
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v116-audit-receipt-removal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact receipt deletion safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          start=s.find('async removeReceiptInternal(id){'); assert start>=0
          end=s.find('async removeRecurrenceInternal',start); assert end>=0
          old=s[start:end]
          assert 'latest' in old.lower() or 'mais recente' in old.lower(), old[:1200]
          new="""async removeReceiptInternal(id){let r=this.receipts.find(x=>Number(x.id)===Number(id));if(!r)return;let payment=this.payments.find(p=>Number(p.receiptId)===Number(r.id)||Number(p.id)===Number(r.paymentId));await db.transaction('rw',db.receipts,db.payments,async()=>{await db.receipts.delete(id);if(payment&&Number(payment.receiptId)===Number(r.id))await db.payments.update(payment.id,{receiptId:null})});await this.logAction('delete','Recibo excluído; pagamento preservado','Nº '+r.number+' • '+(r.providerName||this.providerName(r.providerId))+' • '+this.money(r.total||0));await this.load();this.toast('Recibo nº '+r.number+' excluído. O pagamento correspondente foi preservado e pode receber novo recibo.')},"""
          s=s[:start]+new+s[end:]
          assert 'Recibo excluído; pagamento preservado' in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v116-exact-receipt-deletion'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v116-audit-receipt-removal.yml v116-receipt-removal-audit.txt
          git commit -m 'v116: allow exact receipt deletion safely'
          git push
