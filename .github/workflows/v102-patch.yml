name: v102 cleanup temporary tooling
on:
  push:
    paths:
      - '.github/workflows/v102-patch.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove v102 temporary files only
        run: |
          rm -f \
            tools/v102_inspection.txt \
            .github/workflows/v102-inspect.yml \
            .github/workflows/v102-patch.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary v102 audit tooling"
          git push
