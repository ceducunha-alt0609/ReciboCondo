name: v166 fix receipt print button
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix new receipt print action
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = '<button @click="printReceipt" class="secondary w-full">Imprimir / Salvar PDF</button>'
          new = '<button @click="printReceipt()" class="secondary w-full">Imprimir / Salvar PDF</button>'
          count = s.count(old)
          assert count == 1, f'Esperado 1 botão defeituoso, encontrado {count}'
          index.write_text(s.replace(old, new, 1), encoding='utf-8')

          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          old_cache = "const CACHE_NAME = 'recibocondo-v165-splash-native-css';"
          new_cache = "const CACHE_NAME = 'recibocondo-v166-receipt-print-call';"
          count_cache = sw.count(old_cache)
          assert count_cache == 1, f'Cache esperado não encontrado: {count_cache}'
          swp.write_text(sw.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: executa impressão do recibo novo'
          git rm .github/workflows/v166-fix-receipt-print.yml
          git commit -m 'chore: remove patch temporario de impressao'
          git push
