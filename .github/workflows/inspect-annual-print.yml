name: Auditar impressao anual
on:
  push:
    branches:
      - audit/provider-duplicates
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_annual_print.py
      - run: |
          git config user.name 'ReciboCondo Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add annual-print-inspection.txt
          git commit -m 'Inspect annual print calculations' || exit 0
          git push