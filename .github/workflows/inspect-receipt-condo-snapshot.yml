name: Inspecionar snapshot do condominio no recibo
on:
  push:
    branches: [audit/receipt-provider-snapshot]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair campos de condominio usados no receiptPrint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); a=s.find('id="receiptPrint"'); b=s.find('id="reportPrint"',a)
          if a<0: raise SystemExit('receiptPrint nao encontrado')
          if b<0: b=min(len(s),a+200000)
          sec=s[a:b]
          pats=['settings.condoName','settings.manager','settings.address','settings.city','settings.logo','currentReceipt?.condoName','currentReceipt?.manager','currentReceipt?.address','currentReceipt?.city']
          out=[]
          for p in pats:
              out.append(p+': '+str(sec.count(p)))
          # capture nearby text for any condo/manager occurrence, but strip huge data URLs
          sec=re.sub(r'data:image/[^"\']+','data:image/...',sec)
          for term in ['condoName','manager','address','city','settings.logo']:
              pos=0
              while True:
                  i=sec.find(term,pos)
                  if i<0: break
                  out.append('\n--- '+term+' ---\n'+sec[max(0,i-300):i+500])
                  pos=i+len(term)
          Path('receipt-condo-snapshot.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Receipt Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add receipt-condo-snapshot.txt
          git commit -m 'Inspect condo snapshot used by receipt reprint' || exit 0
          git push
