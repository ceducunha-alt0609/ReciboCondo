name: v111 audit recurrence semantics
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v111-audit-recurrence.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract recurrence form and routines
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          keys=['resetRecurrence(){','async saveRecurrence(){','async generateRecurrence(','async generateAllRecurrencesForMonth(){','paymentDay','dueDay','recurrenceForm']
          out=[]
          for k in keys:
              i=s.find(k)
              out.append('\n===== '+k+' =====\n')
              if i<0:
                  out.append('NOT FOUND\n')
                  continue
              out.append(s[max(0,i-2500):i+8000])
          Path('v111-recurrence-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v111-recurrence-audit.txt
          git commit -m 'v111: capture recurrence semantics audit'
          git push
