name: v106 fix report chart visible
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v106-fix-report-chart-visible.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch report chart visibility/reactivity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<section x-show="view===\'relatorios\'" class="space-y-4">'
          new='<section x-show="view===\'relatorios\'" x-effect="view; report.from; report.to; report.category; report.status; if(view===\'relatorios\') $nextTick(()=>renderCharts())" class="space-y-4">'
          assert s.count(old)==1, f'report section anchor count={s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          old_cache='recibocondo-v105-reactive-report-chart'
          new_cache='recibocondo-v106-report-chart-visible-reactive'
          assert w.count(old_cache)==1, 'unexpected service worker cache anchor'
          sw.write_text(w.replace(old_cache,new_cache,1),encoding='utf-8')

          check=p.read_text(encoding='utf-8')
          assert 'x-effect="view; report.from; report.to; report.category; report.status;' in check
          assert new_cache in sw.read_text(encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v106-fix-report-chart-visible.yml
          git commit -m 'v106: render report chart after visible filter updates'
          git push
