name: v126 remove dead paid ranking helper
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v126-audit-provider-spend-rankings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused paidValue ranking helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="topPaidNames(rows){let map={};rows.forEach(s=>{let v=Number(s.paidValue||0);if(v<=0)return;let name=this.providerName(s.providerId);map[name]=(map[name]||0)+v});return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([name,total])=>name+' • '+this.money(total))},"
          assert s.count(old)==1
          s=s.replace(old,'',1)
          assert 'topPaidNames(' not in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v126-remove-dead-paid-ranking'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v126-audit-provider-spend-rankings.yml v126-provider-spend-rankings-audit.txt
          git commit -m 'v126: remove unused paidValue ranking helper'
          git push
