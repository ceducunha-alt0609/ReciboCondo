name: Corrigir relatorio por recibo v2
on:
  push:
    branches: [fix/report-multiple-receipts]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-multiple-receipts
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          a=s.find('get reportRows(){'); b=s.find('get reportTotals(){',a)
          if a<0 or b<0: raise SystemExit('getters nao encontrados')
          if 'get reportDetailRows(){' not in s:
            d="get reportDetailRows(){let rows=[];for(const s of this.reportRows){let rs=this.receipts.filter(r=>Number(r.serviceId)===Number(s.id)).sort((a,b)=>(Number(String(a.number||'').replace(/\\D/g,''))||0)-(Number(String(b.number||'').replace(/\\D/g,''))||0)),sum=0;for(const r of rs){let v=Number(r.total||0);sum+=v;rows.push({...s,reportKey:'r-'+r.id,receiptNumber:r.number||'-',paymentDate:r.paymentDate||r.date||s.paymentDate,description:r.description||s.description,reportValue:v})}let u=Math.max(0,Number(s.paidValue||0)-sum);if(u>0)rows.push({...s,reportKey:'u-'+s.id,receiptNumber:'PENDENTE',paymentDate:s.paymentDate,reportValue:u});if(!rs.length&&u<=0)rows.push({...s,reportKey:'s-'+s.id,receiptNumber:'-',reportValue:Number(s.paidValue||s.amount||0)})}return rows},"
            s=s[:b]+d+s[b:]
          # visible report table
          sec=s.find("<section x-show=\"view==='relatorios'\""); t=s.find('<div class="glass rounded-3xl p-4 overflow-auto scrollbar">',sec); e=s.find('</table></div>',t)+14
          block=s[t:e]
          for old,new in [('x-for="s in reportRows" :key="s.id"','x-for="s in reportDetailRows" :key="s.reportKey"'),('x-text="reportReceiptNumber(s)"','x-text="s.receiptNumber"'),('x-text="money(s.paidValue||0)"','x-text="money(s.reportValue||0)"')]:
            if old not in block: raise SystemExit('tabela tela divergente: '+old)
            block=block.replace(old,new,1)
          s=s[:t]+block+s[e:]
          # printed report
          m='x-text="reportRows.length"'; i=s.find(m, s.find('RELATÓRIO DE PRESTADORES E PAGAMENTOS')-5000)
          if i<0: raise SystemExit('contador PDF nao encontrado')
          s=s[:i]+s[i:].replace(m,'x-text="reportDetailRows.length"',1)
          t=s.find('<table class="report-table mb-5">'); e=s.find('</table>',t)+8; block=s[t:e]
          for old,new in [('x-for="s in reportRows" :key="s.id"','x-for="s in reportDetailRows" :key="s.reportKey"'),('x-text="reportReceiptNumber(s)"','x-text="s.receiptNumber"'),('x-text="money(s.paidValue || s.amount)"','x-text="money(s.reportValue || 0)"')]:
            if old not in block: raise SystemExit('tabela PDF divergente: '+old)
            block=block.replace(old,new,1)
          s=s[:t]+block+s[e:]
          # CSV
          old="this.reportRows.map(s=>[s.serviceDate,s.paymentDate||'',this.providerName(s.providerId),s.category,s.description,s.amount,s.paidValue||0,s.status])"
          new="this.reportDetailRows.map(s=>[s.receiptNumber,s.serviceDate,s.paymentDate||'',this.providerName(s.providerId),s.category,s.description,s.amount,s.reportValue||0,s.status])"
          if old not in s: raise SystemExit('CSV rows nao encontrado')
          s=s.replace(old,new,1).replace("['Data do serviço','Data do pagamento','Prestador','Categoria','Descrição','Valor','Pago','Status']","['Recibo nº','Data do serviço','Data do pagamento','Prestador','Categoria','Descrição','Valor do serviço','Valor deste pagamento','Status']",1)
          p.write_text(s)
          PY
      - name: Cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js'); s=p.read_text(); old="const CACHE_NAME = 'recibocondo-v75-restore-dataclone';"; new="const CACHE_NAME = 'recibocondo-v76-report-multiple-receipts';"
          if s.count(old)!=1: raise SystemExit('cache inesperado')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/inspect-report-multiple-receipts.yml .github/workflows/fix-report-multiple-receipts.yml .github/workflows/fix-report-multiple-receipts-v2.yml report-inspection.txt
          git config user.name 'ReciboCondo Report Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Detail reports by individual receipts'
          git push origin HEAD:fix/report-multiple-receipts