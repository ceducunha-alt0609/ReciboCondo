name: Corrigir mes do dashboard v99
on:
  push:
    branches:
      - audit/provider-duplicates
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_dashboard_month_v99.py
      - run: |
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Respect selected year in dashboard month cards' || exit 0
          git push