name: Blindar importacao legada
on:
  push:
    branches: [audit/receipt-seq-reset]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/receipt-seq-reset
      - name: Corrigir identidade e sequencia legada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="let providerIdByKey={},serviceIdByReceipt={},existingProviders=this.providers.slice(),existingReceiptNumbers=new Set((this.receipts||[]).map(r=>String(r.number||''))),addedProviders=0,addedServices=0,addedReceipts=0;"
          new="let providerIdByKey={},serviceIdByLegacyKey={},existingProviders=this.providers.slice(),legacyKey=(n,d,v,desc)=>[String(n||''),String(d||''),Number(v||0).toFixed(2),String(desc||'').trim()].join('|'),existingLegacyKeys=new Set((this.receipts||[]).filter(r=>r.source==='Excel legado').map(r=>legacyKey(r.number,r.date,r.total,r.description))),addedServiceKeys=new Set(),addedReceiptKeys=new Set(),addedProviders=0,addedServices=0,addedReceipts=0;"
          if s.count(old)!=1: raise SystemExit('cabecalho importador nao encontrado exatamente uma vez')
          s=s.replace(old,new,1)
          old="if(replace){await db.providers.clear();await db.services.clear();await db.receipts.clear();await db.recurrences.clear();existingReceiptNumbers.clear()}"
          new="if(replace){await db.providers.clear();await db.services.clear();await db.receipts.clear();await db.recurrences.clear();existingLegacyKeys.clear()}"
          if s.count(old)!=1: raise SystemExit('bloco replace nao encontrado')
          s=s.replace(old,new,1)
          old="let s={...raw};let legacyReceipt=String(s.legacyReceipt||'');if(!replace&&legacyReceipt&&existingReceiptNumbers.has(legacyReceipt))continue;delete s.id;s.providerId=providerIdByKey[s.legacyProviderKey]||s.providerId;delete s.legacyProviderKey;let id=await db.services.add(s);addedServices++;serviceIdByReceipt[legacyReceipt]=id"
          new="let s={...raw};let legacyReceipt=String(s.legacyReceipt||''),lk=legacyKey(legacyReceipt,s.paymentDate||s.serviceDate,s.amount,s.description);if((!replace&&existingLegacyKeys.has(lk))||addedServiceKeys.has(lk))continue;delete s.id;s.providerId=providerIdByKey[s.legacyProviderKey]||s.providerId;delete s.legacyProviderKey;let id=await db.services.add(s);addedServices++;addedServiceKeys.add(lk);serviceIdByLegacyKey[lk]=id"
          if s.count(old)!=1: raise SystemExit('loop services nao encontrado')
          s=s.replace(old,new,1)
          old="let r={...raw},number=String(r.number||'');if(!replace&&number&&existingReceiptNumbers.has(number))continue;delete r.id;r.providerId=providerIdByKey[r.legacyProviderKey]||r.providerId;r.serviceId=serviceIdByReceipt[number]||r.serviceId;delete r.legacyProviderKey;await db.receipts.add(r);addedReceipts++;if(number)existingReceiptNumbers.add(number)"
          new="let r={...raw},number=String(r.number||''),lk=legacyKey(number,r.date,r.total,r.description);if((!replace&&existingLegacyKeys.has(lk))||addedReceiptKeys.has(lk))continue;delete r.id;r.providerId=providerIdByKey[r.legacyProviderKey]||r.providerId;r.serviceId=serviceIdByLegacyKey[lk]||r.serviceId;delete r.legacyProviderKey;await db.receipts.add(r);addedReceipts++;addedReceiptKeys.add(lk)"
          if s.count(old)!=1: raise SystemExit('loop receipts nao encontrado')
          s=s.replace(old,new,1)
          old="receiptMaxNumber(){return this.receipts.reduce((max,r)=>Math.max(max,Number(String(r.number||'').replace(/\\D/g,'')||0)),0)}"
          new="receiptMaxNumber(){return this.receipts.reduce((max,r)=>r.source==='Excel legado'?max:Math.max(max,Number(String(r.number||'').replace(/\\D/g,'')||0)),0)}"
          if s.count(old)!=1: raise SystemExit('receiptMaxNumber nao encontrado')
          s=s.replace(old,new,1)
          old="let restoredMax=receipts.reduce((m,r)=>Math.max(m,Number(String(r.number||'').replace(/\\D/g,'')||0)),0),safeSeq=Math.max(Number(data.receiptSeq||0),restoredMax);"
          new="let restoredMax=receipts.reduce((m,r)=>r.source==='Excel legado'?m:Math.max(m,Number(String(r.number||'').replace(/\\D/g,'')||0)),0),safeSeq=Math.max(Number(data.receiptSeq||0),restoredMax);"
          if s.count(old)!=1: raise SystemExit('restore sequence nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Renovar cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js'); s=p.read_text()
          import re
          s2,n=re.subn(r"const CACHE_NAME = '[^']+';","const CACHE_NAME = 'recibocondo-v78-legacy-import-safety';",s,count=1)
          if n!=1: raise SystemExit('CACHE_NAME nao encontrado')
          p.write_text(s2)
          PY
      - name: Limpar temporarios e validar
        run: |
          rm -f .github/workflows/inspect-seq-reset.yml .github/workflows/fix-clearall-wording.yml .github/workflows/audit-legacy-import.yml .github/workflows/audit-legacy-duplicates.yml .github/workflows/fix-legacy-import-safety.yml seq-reset-inspection.txt legacy-import-audit.txt legacy-duplicate-details.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks={
            'legacy composite key':"legacyKey=(n,d,v,desc)=>" in s,
            'service composite map':"serviceIdByLegacyKey[lk]=id" in s,
            'receipt composite link':"r.serviceId=serviceIdByLegacyKey[lk]||r.serviceId" in s,
            'legacy excluded max':"r.source==='Excel legado'?max:" in s,
            'legacy excluded restore':"r.source==='Excel legado'?m:" in s,
          }
          print(checks)
          if not all(checks.values()): raise SystemExit('validacao falhou')
          PY
      - name: Commit final
        run: |
          git config user.name 'ReciboCondo Legacy Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden legacy import matching and receipt sequence'
          git push