name: Hotfix ReciboCondo seed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove demo auto-seed safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"  async seed\(\)\{.*?\n    await this\.load\(\);\},\n  async load\(\)\{"
          replacement="  async seed(){let s=await db.settings.get('main');if(s)this.settings=s.value;await this.load();},\n  async load(){"
          new,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Hotfix abortado: esperado 1 bloco seed, encontrado {n}')
          p.write_text(new,encoding='utf-8')
          print('seed automático removido com segurança')
          PY
      - name: Bump service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("recibocondo-v62-isolated-cache", "recibocondo-v63-no-demo-seed")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit hotfix and remove temporary workflow
        run: |
          rm -f .github/workflows/recibocondo-hotfix.yml
          git config user.name "ReciboCondo Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/recibocondo-hotfix.yml
          git commit -m "Stop ReciboCondo demo data from reseeding"
          git push
