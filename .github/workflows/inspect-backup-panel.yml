name: Inspecionar painel de backup
on:
  push:
    branches: [fix/restore-backup-panel]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair trechos de backup/config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['backupHealthLabel','backupHint','@click="backup()"','Restaurar backup','backup-recibocondo','view===\'config\'','Configurações','Apagar dados locais']
          out=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append('\n===== '+term+' @ '+str(i)+' =====\n'+s[max(0,i-2200):i+4200])
                  pos=i+len(term)
          Path('backup-panel-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Backup Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add backup-panel-inspection.txt
          git commit -m 'Inspect backup panel visibility' || exit 0
          git push
