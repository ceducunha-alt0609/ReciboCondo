name: Inspecionar restauracao
on:
  push:
    branches: [fix/restore-dataclone]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair rotina de backup e restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['backup','restore','Restaurar JSON','Backup JSON','FileReader','JSON.parse','db.transaction']
          chunks=[]
          seen=[]
          for needle in needles:
              pos=0
              while True:
                  i=s.lower().find(needle.lower(),pos)
                  if i<0: break
                  start=max(0,i-1400); end=min(len(s),i+3000)
                  key=(start,end)
                  if not any(abs(start-a)<800 for a,b in seen):
                      chunks.append(f'\n===== {needle} @ {i} =====\n'+s[start:end])
                      seen.append(key)
                  pos=i+len(needle)
          Path('restore-inspection.txt').write_text('\n'.join(chunks),encoding='utf-8')
          PY
      - name: Commit inspecao
        run: |
          git config user.name 'ReciboCondo Restore Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add restore-inspection.txt
          git commit -m 'Inspect backup restore flow'
          git push