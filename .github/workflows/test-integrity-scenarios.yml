name: Testar cenarios do vigia
on:
  push:
    branches: [audit/integrity-startup-guard]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar cenarios sinteticos
        run: |
          python3 - <<'PY'
          def audit(providers,services,receipts,settings,seq):
              issues=[]
              provider_ids={int(p['id']) for p in providers if p.get('id') is not None}
              service_ids={int(s['id']) for s in services if s.get('id') is not None}
              modern=[r for r in receipts if r.get('source')!='Excel legado']
              for s in services:
                  pid=s.get('providerId')
                  if pid not in (None,'') and int(pid) not in provider_ids:
                      issues.append('service_provider')
              for r in modern:
                  sid=r.get('serviceId'); pid=r.get('providerId')
                  if sid not in (None,'') and int(sid) not in service_ids:
                      issues.append('receipt_service')
                  if pid not in (None,'') and int(pid) not in provider_ids:
                      issues.append('receipt_provider')
              seen=set()
              for r in modern:
                  n=''.join(c for c in str(r.get('number','')) if c.isdigit())
                  if not n: continue
                  if n in seen: issues.append('duplicate_number')
                  seen.add(n)
              for s in services:
                  linked=[r for r in modern if int(r.get('serviceId',-1))==int(s.get('id',-2))]
                  issued=sum(float(r.get('total') or 0) for r in linked)
                  paid=float(s.get('paidValue') or 0)
                  if linked and issued>paid+0.009: issues.append('issued_above_paid')
              records=len(providers)+len(services)+len(receipts)
              if records>0 and (not str(settings.get('condoName','')).strip() or not str(settings.get('manager','')).strip()): issues.append('settings_incomplete')
              def num(r):
                  if r.get('source')=='Excel legado': return 0
                  x=''.join(c for c in str(r.get('number','')) if c.isdigit())
                  return int(x or 0)
              mx=max([num(r) for r in receipts]+[0])
              if int(seq or 0)<mx: issues.append('seq_behind')
              return issues

          P=[{'id':1}]
          S=[{'id':10,'providerId':1,'paidValue':500}]
          R=[{'id':100,'serviceId':10,'providerId':1,'number':'000001','total':500}]
          CFG={'condoName':'Condominio Primavera','manager':'Carlos'}
          tests={
            'healthy': (P,S,R,CFG,1, []),
            'missing_provider': ([],S,R,CFG,1, ['service_provider','receipt_provider']),
            'orphan_receipt': (P,[],R,CFG,1, ['receipt_service']),
            'overissued': (P,S,[{**R[0],'total':600}],CFG,1, ['issued_above_paid']),
            'blank_settings': (P,S,R,{'condoName':'','manager':''},1, ['settings_incomplete']),
            'sequence_behind': (P,S,R,CFG,0, ['seq_behind']),
            'duplicate_modern': (P,S,R+[{'id':101,'serviceId':10,'providerId':1,'number':'000001','total':0}],CFG,1, ['duplicate_number']),
            'legacy_duplicate_allowed': (P,S,[{'id':200,'serviceId':10,'providerId':1,'number':'201651','total':500,'source':'Excel legado'},{'id':201,'serviceId':10,'providerId':1,'number':'201651','total':500,'source':'Excel legado'}],CFG,0, []),
          }
          failed=[]
          for name,(p,s,r,c,q,expected) in tests.items():
              got=audit(p,s,r,c,q)
              if sorted(got)!=sorted(expected): failed.append((name,got,expected))
              print(name, '=>', got)
          if failed:
              raise SystemExit('Falhas: '+repr(failed))
          print('Todos os cenarios passaram.')
          PY
