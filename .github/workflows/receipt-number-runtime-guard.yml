name: Blindar emissao de recibos

on:
  push:
    branches: [fix/transacoes-seguras-importacao]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transacoes-seguras-importacao
      - name: Usar maior numero existente na emissao
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="let meta=await db.meta.get('receiptSeq'),next=(meta?.value||0)+1;"
          new="let meta=await db.meta.get('receiptSeq'),next=Math.max(Number(meta?.value||0),this.receiptMaxNumber())+1;"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: emissor alvo encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v65-receipt-sequence-safe';"
          new="const CACHE_NAME = 'recibocondo-v66-runtime-receipt-guard';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit da correcao e remover workflow temporario
        run: |
          rm -f .github/workflows/receipt-number-runtime-guard.yml
          git config user.name "ReciboCondo Receipt Runtime Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/receipt-number-runtime-guard.yml
          git commit -m "Guard receipt issuance against stale sequence"
          git push origin HEAD:fix/transacoes-seguras-importacao
