name: v130 audit integrity visibility
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v130-audit-integrity-visibility.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture integrity audit visibility paths
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['auditDataIntegrity','integrityIssues','Integridade','integridade','diagnóstico','Diagnóstico','console.warn','issues.length']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0;n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'#{n} at {i}\n{s[max(0,i-1100):i+2800]}\n')
                  start=i+len(term)
              out.append(f'COUNT={n}\n')
          Path('v130-integrity-visibility-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v130-integrity-visibility-audit.txt
          git commit -m 'v130: capture integrity visibility audit'
          git push
