name: Inspecionar campos usados na reimpressao
on:
  push:
    branches: [audit/receipt-provider-snapshot]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair somente campos do currentReceipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          a=s.find('id="receiptPrint"')
          b=s.find('id="reportPrint"',a)
          if a<0: raise SystemExit('receiptPrint nao encontrado')
          if b<0: b=min(len(s),a+200000)
          sec=s[a:b]
          fields=sorted(set(re.findall(r'currentReceipt(?:\?\.)?\.([A-Za-z_][A-Za-z0-9_]*)',sec)))
          expr=sorted(set(re.findall(r'currentReceipt[^"<]{0,180}',sec)))
          out=['FIELDS: '+', '.join(fields),'','EXPRESSIONS:']+expr
          Path('receipt-print-fields.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Receipt Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add receipt-print-fields.txt
          git commit -m 'Inspect fields used by receipt reprint' || exit 0
          git push
