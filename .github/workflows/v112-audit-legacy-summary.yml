name: v112 audit legacy payment summary
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v112-audit-legacy-summary.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture remaining legacy payment summary usages
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['.paymentDate','.paymentMethod','.paidValue','openDeletePaymentModal(','reportReceiptNumber(']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0; n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'\n--- occurrence {n} at {i} ---\n')
                  out.append(s[max(0,i-700):i+1200])
                  start=i+len(term)
              out.append(f'\nCOUNT={n}\n')
          Path('v112-legacy-summary-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v112-legacy-summary-audit.txt
          git commit -m 'v112: capture legacy payment summary audit'
          git push
