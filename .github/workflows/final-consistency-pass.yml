name: Ajustes finais de consistencia

on:
  push:
    branches: [fix/final-consistency-pass]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-consistency-pass

      - name: Alinhar recorrencias e textos de seguranca
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          reps=[
            ("note:'Os lançamentos já existentes permanecerão no histórico, mas podem ficar sem vínculo direto com o cadastro.'",
             "note:'Prestadores com lançamentos, recibos ou recorrências vinculadas não podem ser excluídos. Isso preserva a rastreabilidade do histórico.'"),
            ("note:'Recibos já emitidos devem ser conferidos antes de excluir o lançamento correspondente.'",
             "note:'Lançamentos com pagamento ou recibo vinculado não podem ser excluídos por aqui. Use o fluxo de pagamentos/recibos para preservar o histórico.'"),
            ("subtitle:'Remove apenas a regra recorrente.',note:'Os lançamentos já gerados serão mantidos. O recibo e a numeração oficial não são afetados.'",
             "subtitle:'Remove apenas a regra recorrente quando ainda não há histórico gerado.',note:'Se esta recorrência já gerou lançamentos, ela deverá ser inativada em vez de excluída, preservando a origem do histórico.'"),
            ("async removeRecurrenceInternal(id){let r=this.recurrences.find(x=>Number(x.id)===Number(id));await db.recurrences.delete(id);await this.logAction('delete','Recorrência excluída',r?this.providerName(r.providerId)+' • '+this.money(r.amount||0):('ID '+id));await this.load()}",
             "async removeRecurrenceInternal(id){let r=this.recurrences.find(x=>Number(x.id)===Number(id));if(!r)return;let linked=this.services.some(s=>Number(s.recurrenceId)===Number(id));if(linked){if(r.active)await db.recurrences.update(id,{active:false});await this.logAction('recurrence','Recorrência preservada como inativa',this.providerName(r.providerId)+' • '+this.money(r.amount||0));await this.load();return this.toast('Esta recorrência já possui lançamentos gerados e foi mantida como inativa para preservar o histórico.','warning')}await db.recurrences.delete(id);await this.logAction('delete','Recorrência excluída',this.providerName(r.providerId)+' • '+this.money(r.amount||0));await this.load()}"),
          ]

          for old,new in reps:
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'Patch abortado: trecho esperado encontrado {c} vez(es): {old[:70]}')
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('textos e recorrencias alinhados')
          PY

      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v72-partial-payment-receipts';"
          new="const CACHE_NAME = 'recibocondo-v73-final-consistency';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit da correcao e remover workflow temporario
        run: |
          rm -f .github/workflows/final-consistency-pass.yml
          git config user.name "ReciboCondo Consistency Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/final-consistency-pass.yml
          git commit -m "Align recurrence history and safety messages"
          git push origin HEAD:fix/final-consistency-pass
