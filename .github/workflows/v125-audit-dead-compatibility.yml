name: v125 ledger monthly totals
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v125-audit-dead-compatibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make monthly paid totals ledger based
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="get servicePanelPaidRows(){return this.servicePanelRows.filter(s=>Number(s.paidValue||0)>0).sort((a,b)=>String(b.paymentDate||b.serviceDate).localeCompare(String(a.paymentDate||a.serviceDate)))},\n  get servicePanelPaymentEvents(){let ref=this.servicePanelMonth;return this.payments.map(p=>{let service=this.services.find(s=>Number(s.id)===Number(p.serviceId))||null,receipt=p.receiptId?this.receipts.find(r=>Number(r.id)===Number(p.receiptId)):null;return{...p,paymentDate:p.date||'',paymentMethod:p.method||'',paidValue:Number(p.amount||0),service,receipt}}).filter(p=>String(p.date||'').slice(0,7)===ref).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.id||0)-Number(a.id||0))},\n  get servicePanelOpenRows(){return this.servicePanelRows.filter(s=>this.balance(s)>0).sort((a,b)=>String(a.dueDate||'2999-12-31').localeCompare(String(b.dueDate||'2999-12-31')))},\n  get servicePanelTotals(){let expected=this.servicePanelRows.reduce((a,s)=>a+Number(s.amount||0),0),paid=this.servicePanelRows.reduce((a,s)=>a+Number(s.paidValue||0),0);return{expected,paid,open:Math.max(0,expected-paid)}}"
          new="get servicePanelPaymentEvents(){let ref=this.servicePanelMonth;return this.payments.map(p=>{let service=this.services.find(s=>Number(s.id)===Number(p.serviceId))||null,receipt=p.receiptId?this.receipts.find(r=>Number(r.id)===Number(p.receiptId)):null;return{...p,paymentDate:p.date||'',paymentMethod:p.method||'',paidValue:Number(p.amount||0),service,receipt}}).filter(p=>String(p.date||'').slice(0,7)===ref).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.id||0)-Number(a.id||0))},\n  get servicePanelOpenRows(){return this.servicePanelRows.filter(s=>this.balance(s)>0).sort((a,b)=>String(a.dueDate||'2999-12-31').localeCompare(String(b.dueDate||'2999-12-31')))},\n  get servicePanelTotals(){let expected=this.servicePanelRows.reduce((a,s)=>a+Number(s.amount||0),0),paid=this.servicePanelPaymentEvents.reduce((a,p)=>a+Number(p.amount||0),0),open=this.servicePanelRows.reduce((a,s)=>a+this.balance(s),0);return{expected,paid,open}}"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          s=s.replace("x-text=\"servicePanelPaidRows.length+' pagamento(s)'\"","x-text=\"servicePanelPaymentEvents.length+' pagamento(s)'\"",1)
          assert 'servicePanelPaidRows' not in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v125-ledger-monthly-totals'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v125-audit-dead-compatibility.yml v125-dead-compatibility-audit.txt
          git commit -m 'v125: align monthly totals with payment ledger'
          git push
