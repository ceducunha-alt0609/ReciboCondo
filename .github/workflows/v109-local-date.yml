name: v109 local date safety
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v109-local-date.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix local calendar date helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="today(){return new Date().toISOString().slice(0,10)}"
          new="today(){let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}"
          assert s.count(old)==1, f'today helper count={s.count(old)}'
          s=s.replace(old,new,1)
          assert old not in s
          assert new in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w2,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v109-local-calendar-date'",w,count=1)
          assert n==1
          sw.write_text(w2,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v109-local-date.yml
          git commit -m 'v109: use local calendar date for defaults'
          git push
