name: Blindar importacao Excel repetida

on:
  push:
    branches: [fix/legacy-import-idempotent]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-import-idempotent
      - name: Tornar importacao adicionar idempotente
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.find('async importLegacyExcel(replace=false,skipConfirm=false){')
          b=s.find(',async clearAllInternal',a)
          if a<0 or b<0 or s.count('async importLegacyExcel(replace=false,skipConfirm=false){')!=1:
              raise SystemExit(f'Patch abortado: marcadores import={a} clear={b}')
          imp="""async importLegacyExcel(replace=false,skipConfirm=false){if(this.isViewer)return;if(!skipConfirm){this.openImportModal(replace);return}try{let res=await fetch('./assets/data/excel_legacy_import.json');if(!res.ok)throw new Error('Arquivo de importação não encontrado');let data=await res.json();if(!data||typeof data!=='object')throw new Error('Base Excel inválida');let providerIdByKey={},serviceIdByReceipt={},existingProviders=this.providers.slice(),existingReceiptNumbers=new Set((this.receipts||[]).map(r=>String(r.number||''))),addedProviders=0,addedServices=0,addedReceipts=0;await db.transaction('rw',db.providers,db.services,db.receipts,db.recurrences,db.meta,async()=>{if(replace){await db.providers.clear();await db.services.clear();await db.receipts.clear();await db.recurrences.clear();existingReceiptNumbers.clear()}for(const raw of (Array.isArray(data.providers)?data.providers:[])){let p={...raw};let legacyKey=p.legacyKey;delete p.id;delete p.legacyKey;let existing=existingProviders.find(x=>(x.document&&p.document&&x.document===p.document)||x.name===p.name);let id;if(existing&&!replace){id=existing.id}else{id=await db.providers.add(p);addedProviders++}providerIdByKey[legacyKey]=id}for(const raw of (Array.isArray(data.services)?data.services:[])){let s={...raw};let legacyReceipt=String(s.legacyReceipt||'');if(!replace&&legacyReceipt&&existingReceiptNumbers.has(legacyReceipt))continue;delete s.id;s.providerId=providerIdByKey[s.legacyProviderKey]||s.providerId;delete s.legacyProviderKey;let id=await db.services.add(s);addedServices++;serviceIdByReceipt[legacyReceipt]=id}for(const raw of (Array.isArray(data.receipts)?data.receipts:[])){let r={...raw},number=String(r.number||'');if(!replace&&number&&existingReceiptNumbers.has(number))continue;delete r.id;r.providerId=providerIdByKey[r.legacyProviderKey]||r.providerId;r.serviceId=serviceIdByReceipt[number]||r.serviceId;delete r.legacyProviderKey;await db.receipts.add(r);addedReceipts++;if(number)existingReceiptNumbers.add(number)}await db.meta.put({key:'legacyImport',value:{when:new Date().toISOString(),replace,counts:data.meta||{},added:{providers:addedProviders,services:addedServices,receipts:addedReceipts}}})});await this.logAction('restore',replace?'Base Excel substituída':'Base Excel adicionada',addedProviders+' prestadores, '+addedServices+' serviços e '+addedReceipts+' recibos adicionados sem duplicar números existentes.');await this.load();this.toast('Importação concluída: '+addedProviders+' prestadores, '+addedServices+' serviços e '+addedReceipts+' recibos adicionados.')}catch(e){console.error(e);this.toast('Erro na importação: '+e.message+'. Nenhum dado anterior foi perdido.','error')}}"""
          s=s[:a]+imp+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v69-payment-history-guard';"
          new="const CACHE_NAME = 'recibocondo-v70-legacy-import-idempotent';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit da correcao e remover workflow temporario
        run: |
          rm -f .github/workflows/legacy-import-idempotent.yml
          git config user.name "ReciboCondo Legacy Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/legacy-import-idempotent.yml
          git commit -m "Prevent duplicate legacy imports"
          git push origin HEAD:fix/legacy-import-idempotent
