name: Inspect recurrence
on:
  push:
    branches: [audit/provider-duplicates]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/inspect_recurrence.py
      - run: |
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add recurrence-inspection.txt
          git diff --cached --quiet || git commit -m 'Inspect recurrence logic'
          git push
