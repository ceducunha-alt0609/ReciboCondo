name: Inspecionar exclusao pagamento recibo
on:
  push:
    branches: [audit/payment-receipt-delete]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair rotinas criticas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['removePaymentInternal','removeReceiptInternal','issueReceipt','openDeletePaymentModal','openDeleteReceiptModal']
          out=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append('\n===== '+term+' @ '+str(i)+' =====\n'+s[max(0,i-1400):i+3200])
                  pos=i+len(term)
          Path('payment-receipt-delete-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add payment-receipt-delete-inspection.txt
          git commit -m 'Inspect payment and receipt deletion flow'
          git push