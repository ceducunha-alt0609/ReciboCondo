name: Proteger data do pagamento
on:
  push:
    branches: [audit/provider-duplicates]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          old="async savePayment(){if(this.isViewer)return;let s=this.paymentTarget,value=Number(this.payment.value||0),remaining=Math.max(0,Number(s.amount||0)-Number(s.paidValue||0));"
          new="async savePayment(){if(this.isViewer)return;let s=this.paymentTarget,value=Number(this.payment.value||0),paymentDate=this.payment.date||this.today(),remaining=Math.max(0,Number(s.amount||0)-Number(s.paidValue||0));"
          if old not in s: raise SystemExit('savePayment nao encontrado')
          s=s.replace(old,new,1)
          s=s.replace("paymentDate:this.payment.date,paymentMethod:this.payment.method,status", "paymentDate,paymentMethod:this.payment.method,status",1)
          p.write_text(s)
          sw=Path('sw.js'); w=sw.read_text()
          w2=re.sub(r"const CACHE_NAME = 'recibocondo-v[^']+';", "const CACHE_NAME = 'recibocondo-v93-payment-date-guard';", w, count=1)
          if w2==w: raise SystemExit('Cache nao atualizado')
          sw.write_text(w2)
          if 'paymentDate=this.payment.date||this.today()' not in s: raise SystemExit('Trava nao aplicada')
          PY
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Ensure payments always have a date' || exit 0
          git push