name: v105 audit report chart
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v105-audit-report-chart.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract concise chart logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['repChart','new Chart','Chart(','$watch','view===\'relatorios\'','report.from','report.to']
          out=[]
          for term in terms:
              out.append(f'\n===== {term} =====\n')
              matches=list(re.finditer(re.escape(term),s))[:30]
              out.append(f'COUNT={len(matches)}\n')
              for i,m in enumerate(matches,1):
                  a=max(0,m.start()-900); b=min(len(s),m.end()+1800)
                  out.append(f'\n--- MATCH {i} @ {m.start()} ---\n{s[a:b]}\n')
          Path('v105-report-chart-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v105-report-chart-audit.txt
          git commit -m 'v105: refine report chart audit context'
          git push
