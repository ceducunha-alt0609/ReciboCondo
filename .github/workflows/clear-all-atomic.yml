name: Blindar apagar dados locais

on:
  push:
    branches: [fix/clear-all-atomic]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clear-all-atomic
      - name: Tornar limpeza local atomica
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="async clearAllInternal(){await db.providers.clear();await db.services.clear();await db.receipts.clear();await db.recurrences.clear();await db.logs.clear();await this.load()}"
          new="async clearAllInternal(){await db.transaction('rw',db.providers,db.services,db.receipts,db.recurrences,db.logs,async()=>{await db.providers.clear();await db.services.clear();await db.receipts.clear();await db.recurrences.clear();await db.logs.clear()});await this.load()}"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: clearAllInternal encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v70-legacy-import-idempotent';"
          new="const CACHE_NAME = 'recibocondo-v71-clear-all-atomic';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit da correcao e remover workflow temporario
        run: |
          rm -f .github/workflows/clear-all-atomic.yml
          git config user.name "ReciboCondo Clear Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/clear-all-atomic.yml
          git commit -m "Make clear-all operation atomic"
          git push origin HEAD:fix/clear-all-atomic
