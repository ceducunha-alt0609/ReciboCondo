name: Proteger sequencia manual de recibos
on:
  push:
    branches: [fix/receipt-sequence-integer-guard]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar validacao da sequencia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          old="async saveReceiptSequence(){if(this.isViewer)return;let target=Number(this.receiptSeqInput||0), max=this.receiptMaxNumber();if(!target||target<1)return this.toast('Informe um próximo número válido.','warning');if(target<=max)return this.toast('O número precisa ser maior que o último emitido: '+String(max).padStart(6,'0')+'.','warning');"
          new="async saveReceiptSequence(){if(this.isViewer)return;let target=Number(this.receiptSeqInput||0), max=this.receiptMaxNumber();if(!Number.isSafeInteger(target)||target<1)return this.toast('Informe um próximo número inteiro e válido.','warning');if(target<=max)return this.toast('O número precisa ser maior que o último emitido: '+String(max).padStart(6,'0')+'.','warning');"
          if old not in s: raise SystemExit('Rotina da sequencia nao encontrada no formato esperado')
          s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('sw.js'); w=sw.read_text()
          w2=re.sub(r"const CACHE_NAME = 'recibocondo-v[^']+';", "const CACHE_NAME = 'recibocondo-v90-sequence-guard';", w, count=1)
          if w2==w: raise SystemExit('Cache nao atualizado')
          sw.write_text(w2)
          out=p.read_text()
          if "Number.isSafeInteger(target)" not in out: raise SystemExit('Protecao nao aplicada')
          PY
      - name: Commit
        run: |
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Require safe integer receipt sequence values' || exit 0
          git push