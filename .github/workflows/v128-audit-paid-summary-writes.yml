name: v128 audit paid summary writes
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v128-audit-paid-summary-writes.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture paid summary write paths
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['paidValue:','paymentDate:','paymentMethod:','status:','db.services.update(','db.services.put(','db.services.add(','Object.assign(s','saveService(){','savePayment(){','removeSinglePaymentInternal(id)']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0;n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'\n--- occurrence {n} at {i} ---\n')
                  out.append(s[max(0,i-1200):i+2600])
                  start=i+len(term)
              out.append(f'\nCOUNT={n}\n')
          Path('v128-paid-summary-writes-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v128-paid-summary-writes-audit.txt
          git commit -m 'v128: capture paid summary write audit'
          git push
