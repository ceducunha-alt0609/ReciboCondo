name: v114 safe payment deletion
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v114-audit-payment-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove bulk payment deletion from aggregate UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<option value="servico">Abrir serviço</option><option value="excluirPagamento" :disabled="isViewer || Number(s.paidValue||0)<=0">Excluir pagamento</option>'
          assert s.count(old)==1, f'aggregate delete option count={s.count(old)}'
          s=s.replace(old,'<option value="servico">Abrir serviço</option>',1)
          old_branch="else if(action==='servico')this.openSearchService(s);else if(action==='excluirPagamento'){if(!this.isViewer&&Number(s.paidValue||0)>0)this.openDeletePaymentModal(s)}"
          assert s.count(old_branch)==1, f'paymentAction branch count={s.count(old_branch)}'
          s=s.replace(old_branch,"else if(action==='servico')this.openSearchService(s)",1)
          # Individual payment deletion must remain available.
          assert 'openDeleteSinglePaymentModal(p)' in s
          assert 'removeSinglePaymentInternal(id)' in s
          assert 'Excluir este pagamento' in s
          assert 'value="excluirPagamento"' not in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8')
          w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v114-safe-individual-payment-delete'",w,count=1)
          assert n==1
          sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v114-audit-payment-delete.yml v114-payment-delete-audit.txt
          git commit -m 'v114: remove bulk payment delete from aggregate view'
          git push
