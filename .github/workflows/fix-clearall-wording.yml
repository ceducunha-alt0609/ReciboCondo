name: Ajustar texto do reset
on:
  push:
    branches: [audit/receipt-seq-reset]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/receipt-seq-reset
      - name: Ajustar textos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          pairs=[
            ('Apagar todos os dados','Apagar dados operacionais'),
            ('Remove permanentemente todos os prestadores, serviços, recibos e recorrências salvos neste navegador. Recomenda-se gerar um backup JSON antes de prosseguir.','Remove permanentemente prestadores, serviços, recibos, recorrências e logs salvos neste navegador. Os dados do condomínio e a sequência oficial dos recibos são preservados. Recomenda-se gerar um backup JSON antes de prosseguir.'),
            ("title:'Apagar dados locais',subtitle:'Essa ação remove os dados salvos neste navegador.',note:'Faça backup JSON antes de apagar, caso precise recuperar os dados depois.',confirmLabel:'Apagar dados',details:[{label:'Impacto',value:'Prestadores, serviços, recibos e recorrências locais'},{label:'Recomendação',value:'Exportar backup antes'}]","title:'Apagar dados operacionais',subtitle:'Essa ação remove os registros operacionais salvos neste navegador.',note:'A numeração oficial dos recibos e os dados do condomínio serão preservados. Faça backup JSON antes de apagar, caso precise recuperar os registros depois.',confirmLabel:'Apagar registros',details:[{label:'Remove',value:'Prestadores, serviços, recibos, recorrências e logs'},{label:'Preserva',value:'Dados do condomínio e sequência dos recibos'}]")
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit('texto esperado nao encontrado: '+old[:60])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Renovar cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js'); s=p.read_text()
          import re
          m=re.search(r"const CACHE_NAME = '([^']+)';",s)
          if not m: raise SystemExit('CACHE_NAME nao encontrado')
          s=s[:m.start(1)]+'recibocondo-v77-clearall-wording'+s[m.end(1):]
          p.write_text(s)
          PY
      - name: Limpar diagnostico e validar
        run: |
          rm -f .github/workflows/inspect-seq-reset.yml .github/workflows/fix-clearall-wording.yml seq-reset-inspection.txt
          git diff --check
          git diff --name-only
      - name: Commit
        run: |
          git config user.name 'ReciboCondo Audit Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Clarify operational reset preserves numbering and settings'
          git push origin HEAD:audit/receipt-seq-reset