name: Corrigir grafico de relatorios v98
on:
  push:
    branches:
      - audit/provider-duplicates
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_report_chart_v98.py
      - run: |
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Align report chart with payment dates' || exit 0
          git push