name: Inspecionar relatorio com multiplos recibos
on:
  push:
    branches: [fix/report-multiple-receipts]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair trechos do relatorio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['reportRows','reportReceiptNumber','RELATÓRIO DE PRESTADORES E PAGAMENTOS','RECIBO Nº','printReport']
          out=[]
          for term in terms:
            pos=0
            while True:
              i=s.find(term,pos)
              if i<0: break
              out.append(f'\n===== {term} @ {i} =====\n'+s[max(0,i-2200):i+4200])
              pos=i+len(term)
          Path('report-inspection.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit inspecao
        run: |
          git config user.name 'ReciboCondo Report Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add report-inspection.txt
          git commit -m 'Inspect report receipt rendering'
          git push