name: Auditar graficos ReciboCondo
on:
  push:
    branches:
      - audit/provider-duplicates
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_charts.py
      - run: |
          git config user.name 'ReciboCondo Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add chart-inspection.txt
          git commit -m 'Inspect chart calculations' || exit 0
          git push