name: Auditar base Excel legada
on:
  push:
    branches: [audit/receipt-seq-reset]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/receipt-seq-reset
      - name: Auditar JSON legado
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          d=json.loads(Path('assets/data/excel_legacy_import.json').read_text())
          providers=d.get('providers',[]); services=d.get('services',[]); receipts=d.get('receipts',[])
          nums=[]
          for r in receipts:
              n=int(re.sub(r'\D','',str(r.get('number',''))) or 0); nums.append(n)
          from collections import Counter
          c=Counter(nums)
          dup=sorted((n,k) for n,k in c.items() if n and k>1)
          service_receipts=[str(s.get('legacyReceipt','')) for s in services]
          missing=[str(r.get('number','')) for r in receipts if str(r.get('number','')) not in service_receipts]
          orphan_services=[x for x in service_receipts if x and x not in {str(r.get('number','')) for r in receipts}]
          out=[
            f'providers={len(providers)}',f'services={len(services)}',f'receipts={len(receipts)}',
            f'max_receipt={max(nums or [0])}',f'min_receipt={min([n for n in nums if n] or [0])}',
            f'duplicate_receipt_numbers={dup[:50]}',f'duplicate_count={len(dup)}',
            f'receipts_without_service={missing[:50]} count={len(missing)}',
            f'services_without_receipt={orphan_services[:50]} count={len(orphan_services)}',
            'settings='+json.dumps(d.get('settings',{}),ensure_ascii=False)
          ]
          Path('legacy-import-audit.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Legacy Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add legacy-import-audit.txt
          git commit -m 'Audit legacy import dataset'
          git push