name: Blindar exclusao de pagamento e recibo
on:
  push:
    branches: [audit/payment-receipt-delete]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/payment-receipt-delete
      - name: Aplicar protecoes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          old="async removeReceiptInternal(id){let r=this.receipts.find(x=>Number(x.id)===Number(id));await db.receipts.delete(id);"
          new="async removeReceiptInternal(id){let r=this.receipts.find(x=>Number(x.id)===Number(id));if(!r)return;let linked=this.receipts.filter(x=>Number(x.serviceId)===Number(r.serviceId)).sort((a,b)=>Number(b.id||0)-Number(a.id||0)),latest=linked[0];if(latest&&Number(latest.id)!==Number(r.id))return this.toast('Para preservar a data e a forma de pagamento das parcelas, somente o recibo mais recente deste lançamento pode ser excluído e reemitido.','warning');await db.receipts.delete(id);"
          if s.count(old)!=1: raise SystemExit('removeReceiptInternal esperado nao encontrado exatamente uma vez')
          s=s.replace(old,new,1)
          m=re.search(r"openDeletePaymentModal\(s\)\{.*?this\.after\(\)\}",s)
          if not m: raise SystemExit('openDeletePaymentModal nao encontrado')
          block=m.group(0)
          block2=re.sub(r"title:'[^']*'","title:'Excluir todos os pagamentos'",block,count=1)
          block2=re.sub(r"subtitle:'[^']*'","subtitle:'Essa ação zera todo o valor pago deste lançamento.'",block2,count=1)
          block2=re.sub(r"note:'[^']*'","note:'Todos os recibos vinculados a este lançamento também serão removidos. A numeração já utilizada não será reaproveitada.'",block2,count=1)
          block2=re.sub(r"confirmLabel:'[^']*'","confirmLabel:'Excluir pagamentos'",block2,count=1)
          s=s[:m.start()]+block2+s[m.end():]
          p.write_text(s)
          PY
      - name: Renovar cache e retirar Excel do app shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js'); s=p.read_text()
          old="const CACHE_NAME = 'recibocondo-v80-no-excel-import';"
          if s.count(old)!=1: raise SystemExit('cache v80 esperado nao encontrado')
          s=s.replace(old,"const CACHE_NAME = 'recibocondo-v81-payment-receipt-guard';",1)
          s=s.replace("  './assets/data/excel_legacy_import.json',\n",'',1)
          p.write_text(s)
          PY
      - name: Limpar temporarios e validar
        run: |
          rm -f .github/workflows/inspect-payment-receipt-delete.yml .github/workflows/harden-payment-receipt-delete.yml payment-receipt-delete-inspection.txt
          grep -q "somente o recibo mais recente" index.html
          grep -q "Excluir todos os pagamentos" index.html
          ! grep -q "excel_legacy_import.json" sw.js
          grep -q "v81-payment-receipt-guard" sw.js
      - name: Commit final
        run: |
          git config user.name 'ReciboCondo History Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Protect parcel history when deleting payments and receipts'
          git push origin HEAD:audit/payment-receipt-delete