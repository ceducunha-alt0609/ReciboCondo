name: v117 remove dead bulk delete
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v117-audit-dead-bulk-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove orphaned bulk payment deletion code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def remove_func(src, marker):
              start=src.find(marker); assert start>=0, marker
              brace=src.find('{',start); assert brace>=0
              depth=0; quote=None; esc=False; end=None
              for i in range(brace,len(src)):
                  ch=src[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      continue
                  if ch in "'\"`": quote=ch; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
              assert end, marker+' end'
              if end<len(src) and src[end]==',': end+=1
              return src[:start]+src[end:]
          assert s.count('openDeletePaymentModal(')==1
          assert s.count('removePaymentInternal(')==2
          assert s.count("m.type==='deletePayment'")==1
          s=remove_func(s,'openDeletePaymentModal(s){')
          branch="else if(m.type==='deletePayment'){await this.removePaymentInternal(t.id)}"
          assert s.count(branch)==1; s=s.replace(branch,'',1)
          s=remove_func(s,'async removePaymentInternal(id){')
          assert 'openDeletePaymentModal(' not in s
          assert 'removePaymentInternal(' not in s
          assert "m.type==='deletePayment'" not in s
          assert 'openDeleteSinglePaymentModal(' in s and 'removeSinglePaymentInternal(' in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v117-remove-bulk-delete'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v117-audit-dead-bulk-delete.yml v117-dead-bulk-delete-audit.txt
          git commit -m 'v117: remove orphaned bulk payment deletion'
          git push
