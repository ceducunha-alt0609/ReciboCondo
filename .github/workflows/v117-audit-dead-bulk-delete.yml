name: v117 audit dead bulk delete
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v117-audit-dead-bulk-delete.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture all bulk delete references
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['removePaymentInternal(','openDeletePaymentModal(','deletePayment',"type:'deletePayment'",'excluirPagamento']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0;n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'\n--- occurrence {n} at {i} ---\n')
                  out.append(s[max(0,i-1200):i+2600])
                  start=i+len(term)
              out.append(f'\nCOUNT={n}\n')
          Path('v117-dead-bulk-delete-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v117-dead-bulk-delete-audit.txt
          git commit -m 'v117: capture dead bulk delete audit'
          git push
