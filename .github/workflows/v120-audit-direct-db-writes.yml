name: v120 audit direct DB writes
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v120-audit-direct-db-writes.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture direct database mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['db.services.delete(','db.services.clear(','db.services.update(','db.services.put(','db.services.bulkPut(','db.payments.delete(','db.payments.clear(','db.payments.update(','db.payments.put(','db.payments.bulkPut(','db.receipts.delete(','db.receipts.clear(','db.receipts.update(','db.receipts.put(','db.receipts.bulkPut(','db.settings.put(','db.settings.update(','db.settings.clear(','db.meta.put(','clearAllInternal(','restoreBackup(']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0;n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'\n--- occurrence {n} at {i} ---\n')
                  out.append(s[max(0,i-1400):i+3200])
                  start=i+len(term)
              out.append(f'\nCOUNT={n}\n')
          Path('v120-direct-db-writes-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v120-direct-db-writes-audit.txt
          git commit -m 'v120: capture direct DB writes audit'
          git push
