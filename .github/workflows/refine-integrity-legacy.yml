name: Refinar vigia para legado
on:
  push:
    branches: [audit/integrity-startup-guard]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refinar verificacao de vinculos legados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="for(const r of modernReceipts){if(r.serviceId!=null&&r.serviceId!==''&&!serviceIds.has(Number(r.serviceId)))issues.push('Recibo '+(r.number||r.id||'?')+' aponta para lançamento inexistente.');if(r.providerId!=null&&r.providerId!==''&&!providerIds.has(Number(r.providerId)))issues.push('Recibo '+(r.number||r.id||'?')+' aponta para prestador inexistente.')}let seen=new Set();for(const r of modernReceipts)"
          new="for(const r of this.receipts){if(r.serviceId!=null&&r.serviceId!==''&&!serviceIds.has(Number(r.serviceId)))issues.push('Recibo '+(r.number||r.id||'?')+' aponta para lançamento inexistente.');if(r.providerId!=null&&r.providerId!==''&&!providerIds.has(Number(r.providerId)))issues.push('Recibo '+(r.number||r.id||'?')+' aponta para prestador inexistente.')}let seen=new Set();for(const r of modernReceipts)"
          if s.count(old)!=1: raise SystemExit('Assinatura esperada nao encontrada exatamente uma vez')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          if "for(const r of this.receipts){if(r.serviceId" not in s: raise SystemExit('Vinculos nao abrangem todos os recibos')
          if "let seen=new Set();for(const r of modernReceipts)" not in s: raise SystemExit('Duplicidade moderna perdeu filtro')
          print('Refinamento OK')
          PY
      - name: Commit
        run: |
          git config user.name 'ReciboCondo Integrity Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Audit legacy receipt relationships without enforcing legacy numbering' || exit 0
          git push
