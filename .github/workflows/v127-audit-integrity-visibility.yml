name: v127 refine integrity visibility
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v127-audit-integrity-visibility.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture concise config anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['x-show="view===\'config\'"','saveSettings()','Configurações do condomínio','Sequência de recibos','Backup']
          out=[]
          for term in terms:
            out.append('\n===== '+term+' =====\n')
            start=0;n=0
            while True:
              i=s.find(term,start)
              if i<0: break
              n+=1; out.append(f'#{n} at {i}\n{s[max(0,i-800):i+1800]}\n'); start=i+len(term)
            out.append(f'COUNT={n}\n')
          Path('v127-integrity-visibility-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v127-integrity-visibility-audit.txt
          git commit -m 'v127: refine config insertion audit'
          git push
