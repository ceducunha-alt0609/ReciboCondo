name: v127 visible integrity diagnostics
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v127-audit-integrity-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose integrity findings in settings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old_state="providers:[],services:[],receipts:[],recurrences:[],payments:[],logs:[],receiptSeqValue:0,receiptSeqInput:\"\",settings:"
          new_state="providers:[],services:[],receipts:[],recurrences:[],payments:[],logs:[],integrityIssues:[],receiptSeqValue:0,receiptSeqInput:\"\",settings:"
          assert s.count(old_state)==1
          s=s.replace(old_state,new_state,1)
          anchor='''            <button class="primary">Salvar configurações</button>\n          </form>\n\n'''
          block='''            <button class="primary">Salvar configurações</button>\n          </form>\n\n          <div class="glass rounded-3xl p-4 space-y-3">\n            <div class="flex items-start gap-3">\n              <div class="h-11 w-11 rounded-2xl bg-gradient-to-br from-slate-700 to-slate-500 text-white grid place-items-center shadow-soft"><i data-lucide="shield-check" class="w-5 h-5"></i></div>\n              <div>\n                <h3 class="font-black text-lg">Integridade dos dados</h3>\n                <p class="text-xs text-slate-500 dark:text-slate-400">Verificação automática de vínculos entre prestadores, lançamentos, pagamentos, recibos e sequência.</p>\n              </div>\n            </div>\n            <div x-show="!integrityIssues.length" class="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 p-3 text-sm text-emerald-700 font-bold">Integridade OK — nenhum alerta encontrado.</div>\n            <div x-show="integrityIssues.length" class="rounded-2xl border border-amber-500/20 bg-amber-500/10 p-3 space-y-2">\n              <p class="text-sm font-black text-amber-800" x-text="integrityIssues.length+' alerta(s) encontrado(s). Nenhum dado foi alterado automaticamente.'"></p>\n              <ul class="space-y-1 text-sm text-amber-900">\n                <template x-for="(issue,idx) in integrityIssues" :key="'integrity-'+idx"><li class="flex gap-2"><span class="font-black">•</span><span x-text="issue"></span></li></template>\n              </ul>\n            </div>\n          </div>\n\n'''
          assert s.count(anchor)==1
          s=s.replace(anchor,block,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v127-visible-integrity-diagnostics'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v127-audit-integrity-visibility.yml v127-integrity-visibility-audit.txt
          git commit -m 'v127: show integrity diagnostics in settings'
          git push
