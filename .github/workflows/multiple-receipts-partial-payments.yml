name: Suportar recibos por pagamento parcial

on:
  push:
    branches: [fix/multiple-receipts-partial-payments]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multiple-receipts-partial-payments

      - name: Permitir multiplos recibos por servico
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          a=s.find("async savePayment(){")
          b=s.find("prepareReceipt(s){", a)
          if a<0 or b<0 or s.count("async savePayment(){")!=1:
              raise SystemExit(f'Patch abortado em savePayment: a={a}, b={b}, count={s.count("async savePayment(){")}')
          new_save="""async savePayment(){if(this.isViewer)return;let s=this.paymentTarget,value=Number(this.payment.value||0),remaining=Math.max(0,Number(s.amount||0)-Number(s.paidValue||0));if(value<=0)return this.toast('Informe um valor de pagamento maior que zero.','warning');if(value>remaining+0.000001)return this.toast('O pagamento não pode ser maior que o saldo pendente de '+this.money(remaining)+'.','warning');let paid=Number(s.paidValue||0)+value,status=paid>=Number(s.amount)?'Pago':'Parcial';await db.services.update(s.id,{paidValue:paid,paymentDate:this.payment.date,paymentMethod:this.payment.method,status});await this.logAction('payment','Pagamento registrado',this.providerName(s.providerId)+' • '+this.money(value)+' • '+this.payment.method);this.payModal=false;await this.load();this.toast(status==='Pago'?'Pagamento registrado. Lançamento quitado.':'Pagamento parcial registrado. Saldo restante: '+this.money(Math.max(0,Number(s.amount||0)-paid)))}"""
          s=s[:a]+new_save+","+s[b:]

          a=s.find("prepareReceipt(s){")
          b=s.find("printReceipt(){", a)
          if a<0 or b<0 or s.count("prepareReceipt(s){")!=1 or s.count("async issueReceipt(){")!=1:
              raise SystemExit(f'Patch abortado em recibos: a={a}, b={b}, prepare={s.count("prepareReceipt(s){")}, issue={s.count("async issueReceipt(){")}')
          new_receipts="""prepareReceipt(s){this.receiptServiceId=s.id;this.view='recibos';this.after()},async quickReceipt(s){if(this.isViewer)return;if(Number(s.paidValue||0)<=0)return this.toast('Registre o pagamento antes de emitir o recibo.','warning');let linked=this.receipts.filter(r=>Number(r.serviceId)===Number(s.id)),issued=linked.reduce((a,r)=>a+Number(r.total||0),0),pending=Math.max(0,Number(s.paidValue||0)-issued);if(pending<=0){let latest=linked.slice().sort((a,b)=>Number(b.id||0)-Number(a.id||0))[0];if(latest){this.currentReceipt=latest;this.view='recibos';this.after();this.toast('Todos os pagamentos registrados já possuem recibo.','warning');setTimeout(()=>this.printReceipt(),220)}else this.toast('Não há valor pago pendente de recibo.','warning');return}this.receiptServiceId=s.id;await this.issueReceipt();this.view='recibos';this.after();setTimeout(()=>this.printReceipt(),260)},async issueReceipt(){if(this.isViewer)return;let s=this.services.find(x=>Number(x.id)===Number(this.receiptServiceId));if(!s)return this.toast('Selecione um lançamento.','warning');let linked=this.receipts.filter(r=>Number(r.serviceId)===Number(s.id)),issued=linked.reduce((a,r)=>a+Number(r.total||0),0),pending=Math.max(0,Number(s.paidValue||0)-issued);if(pending<=0)return this.toast('Todos os pagamentos registrados deste lançamento já possuem recibo.','warning');let p=this.providers.find(x=>Number(x.id)===Number(s.providerId))||{};let meta=await db.meta.get('receiptSeq'),next=Math.max(Number(meta?.value||0),this.receiptMaxNumber())+1;await db.meta.put({key:'receiptSeq',value:next});let r={number:String(next).padStart(6,'0'),date:this.today(),paymentDate:s.paymentDate||this.today(),providerId:p.id,providerName:p.name||'Prestador não informado',document:p.document||'',category:s.category,reference:s.reference,description:s.description,total:pending,paymentMethod:s.paymentMethod||'Não informado',location:s.location,serviceId:s.id,manager:this.settings.manager,condoName:this.settings.condoName};let id=await db.receipts.add(r);r.id=id;this.currentReceipt=r;await this.logAction('receipt','Recibo emitido','Nº '+r.number+' • '+r.providerName+' • '+this.money(r.total||0));await this.load();this.toast('Recibo nº '+r.number+' emitido no valor de '+this.money(r.total||0)+'.')},"""
          s=s[:a]+new_receipts+s[b:]
          p.write_text(s,encoding='utf-8')
          print('pagamentos parciais e multiplos recibos habilitados')
          PY

      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v71-clear-all-atomic';"
          new="const CACHE_NAME = 'recibocondo-v72-partial-payment-receipts';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit da correcao e remover workflow temporario
        run: |
          rm -f .github/workflows/multiple-receipts-partial-payments.yml
          git config user.name "ReciboCondo Partial Payment Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/multiple-receipts-partial-payments.yml
          git commit -m "Support multiple receipts for partial payments"
          git push origin HEAD:fix/multiple-receipts-partial-payments
