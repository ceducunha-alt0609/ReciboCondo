name: Blindar settings legado

on:
  push:
    branches: [fix/blindar-settings-legado]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blindar-settings-legado
      - name: Blindar dados cadastrais do condomínio
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(data.settings&&replace){this.settings=data.settings;await db.settings.put({key:'main',value:this.settings})}"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: esperado 1 alvo de settings, encontrado {s.count(old)}')
          s=s.replace(old,"",1)
          p.write_text(s,encoding='utf-8')
          print('settings legado isolado: importação não sobrescreve mais dados do condomínio')
          PY
      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v62-isolated';"
          new="const CACHE_NAME = 'recibocondo-v63-settings-protected';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado não encontrado exatamente uma vez ({s.count(old)})')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit da correção e remover workflow temporário
        run: |
          rm -f .github/workflows/blindar-settings-legado.yml
          git config user.name "ReciboCondo Settings Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/blindar-settings-legado.yml
          git commit -m "Protect condo settings from legacy Excel import"
          git push origin HEAD:fix/blindar-settings-legado
