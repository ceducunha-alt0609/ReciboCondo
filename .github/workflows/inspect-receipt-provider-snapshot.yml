name: Inspecionar snapshot do prestador no recibo
on:
  push:
    branches: [audit/receipt-provider-snapshot]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair emissao e impressao de recibo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['providerName:','providerDocument','providerPix','currentReceipt','receiptPrint','quickReceipt','issueReceipt','db.receipts.add','db.receipts.put','providerName(r.providerId)','providerName(s.providerId)']
          out=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append('\n===== '+term+' @ '+str(i)+' =====\n'+s[max(0,i-1800):i+4200])
                  pos=i+len(term)
          Path('receipt-provider-snapshot-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Receipt Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add receipt-provider-snapshot-inspection.txt
          git commit -m 'Inspect receipt provider snapshot behavior' || exit 0
          git push
