name: Proteger duplicidade de prestadores
on:
  push:
    branches: [audit/provider-duplicates]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar trava de CPF CNPJ duplicado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          old="async saveProvider(){if(this.isViewer)return;let d={...this.providerForm};if(d.id){await db.providers.update(d.id,d);await this.logAction('provider','Prestador atualizado',d.name||'Cadastro atualizado')}else{delete d.id;await db.providers.add(d);await this.logAction('provider','Prestador cadastrado',d.name||'Novo prestador')}"
          new="async saveProvider(){if(this.isViewer)return;let d={...this.providerForm};let doc=String(d.document||'').replace(/\\D/g,'');if(doc){let duplicate=this.providers.find(p=>Number(p.id)!==Number(d.id)&&String(p.document||'').replace(/\\D/g,'')===doc);if(duplicate)return this.toast('Já existe um prestador cadastrado com este CPF/CNPJ: '+(duplicate.name||'cadastro existente')+'.','warning')}if(d.id){await db.providers.update(d.id,d);await this.logAction('provider','Prestador atualizado',d.name||'Cadastro atualizado')}else{delete d.id;await db.providers.add(d);await this.logAction('provider','Prestador cadastrado',d.name||'Novo prestador')}"
          if old not in s: raise SystemExit('saveProvider nao encontrado no formato esperado')
          s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('sw.js'); w=sw.read_text()
          w2=re.sub(r"const CACHE_NAME = 'recibocondo-v[^']+';", "const CACHE_NAME = 'recibocondo-v91-provider-duplicate-guard';", w, count=1)
          if w2==w: raise SystemExit('Cache nao atualizado')
          sw.write_text(w2)
          out=p.read_text()
          if 'Já existe um prestador cadastrado com este CPF/CNPJ' not in out: raise SystemExit('Protecao nao aplicada')
          PY
      - name: Commit
        run: |
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Block duplicate provider documents' || exit 0
          git push