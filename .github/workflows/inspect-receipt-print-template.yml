name: Inspecionar template de impressao do recibo
on:
  push:
    branches: [audit/receipt-provider-snapshot]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair template receiptPrint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['id="receiptPrint"','currentReceipt.providerName','currentReceipt.document','currentReceipt.providerId','providerName(currentReceipt','providerDocument']
          out=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append('\n===== '+term+' @ '+str(i)+' =====\n'+s[max(0,i-2500):i+6500])
                  pos=i+len(term)
          Path('receipt-print-template-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Receipt Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add receipt-print-template-inspection.txt
          git commit -m 'Inspect receipt print snapshot usage' || exit 0
          git push
