name: v132 remove unused app members
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v132-audit-unused-members.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove four proven unused members
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          olds=[
            "get topProviders(){return this.annualTopProviders},",
            "get categorySummary(){return this.annualCategorySummary},",
            "prepareReceipt(s){this.receiptServiceId=s.id;this.view='recibos';this.after()},",
            "reportReceiptNumber(service){let rs=this.receipts.filter(x=>Number(x.serviceId)===Number(service.id)).sort((a,b)=>Number(a.id||0)-Number(b.id||0));return rs.length?rs.map(r=>r.number).filter(Boolean).join(', '):'-';},"
          ]
          for old in olds:
              assert s.count(old)==1, old
              s=s.replace(old,'',1)
          for name in ['topProviders','categorySummary','prepareReceipt','reportReceiptNumber']:
              assert not re.search(r'(?<![\w$])'+re.escape(name)+r'(?![\w$])',s), name
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v132-unused-member-cleanup'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v132-audit-unused-members.yml v132-unused-members-audit.txt
          git commit -m 'v132: remove proven unused app members'
          git push
