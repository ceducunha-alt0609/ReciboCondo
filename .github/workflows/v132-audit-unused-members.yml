name: v132 audit unused app members
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v132-audit-unused-members.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find top-level methods and getters with no other references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('function app(){return{')+len('function app(){return{')
          i=start; depth_curly=1; depth_par=depth_br=0; quote=None; esc=False; line=False; block=False; seg=start; parts=[]
          while i<len(s):
              c=s[i]; n=s[i+1] if i+1<len(s) else ''
              if line:
                  if c=='\n': line=False
                  i+=1; continue
              if block:
                  if c=='*' and n=='/': block=False; i+=2; continue
                  i+=1; continue
              if quote:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==quote: quote=None
                  i+=1; continue
              if c=='/' and n=='/': line=True; i+=2; continue
              if c=='/' and n=='*': block=True; i+=2; continue
              if c in "'\"`": quote=c; i+=1; continue
              if c=='{': depth_curly+=1
              elif c=='}':
                  depth_curly-=1
                  if depth_curly==0:
                      parts.append(s[seg:i]); break
              elif c=='(': depth_par+=1
              elif c==')': depth_par-=1
              elif c=='[': depth_br+=1
              elif c==']': depth_br-=1
              elif c==',' and depth_curly==1 and depth_par==0 and depth_br==0:
                  parts.append(s[seg:i]); seg=i+1
              i+=1
          methods=[]
          for p in parts:
              t=p.strip()
              m=re.match(r'(?:async\s+)?([A-Za-z_$][\w$]*)\s*\([^)]*\)\s*\{',t)
              kind='method'
              if not m:
                  m=re.match(r'get\s+([A-Za-z_$][\w$]*)\s*\([^)]*\)\s*\{',t); kind='getter'
              if m: methods.append((m.group(1),kind,t[:240]))
          out=[f'TOP_LEVEL_CALLABLES={len(methods)}\n']
          candidates=[]
          for name,kind,head in methods:
              count=len(re.findall(r'(?<![\w$])'+re.escape(name)+r'(?![\w$])',s))
              if count<=1:
                  candidates.append((name,kind,count,head))
          out.append(f'UNREFERENCED_CANDIDATES={len(candidates)}\n')
          for name,kind,count,head in candidates:
              out.append(f'\n{name} | {kind} | occurrences={count}\n{head}\n')
          Path('v132-unused-members-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v132-unused-members-audit.txt
          git commit -m 'v132: capture unused app member audit'
          git push
