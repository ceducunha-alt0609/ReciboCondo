name: Blindar exclusao de prestador

on:
  push:
    branches: [fix/transacoes-seguras-importacao]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transacoes-seguras-importacao
      - name: Impedir exclusao de prestador com historico
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="async removeProviderInternal(id){let p=this.providers.find(x=>Number(x.id)===Number(id));await db.providers.delete(id);await this.logAction('delete','Prestador excluído',p?.name||('ID '+id));await this.load()}"
          new="async removeProviderInternal(id){let p=this.providers.find(x=>Number(x.id)===Number(id));if(!p)return;let linkedServices=this.services.some(s=>Number(s.providerId)===Number(id)),linkedReceipts=this.receipts.some(r=>Number(r.providerId)===Number(id)),linkedRecurrences=(this.recurrences||[]).some(r=>Number(r.providerId)===Number(id));if(linkedServices||linkedReceipts||linkedRecurrences){return this.toast('Este prestador possui histórico ou recorrência vinculada e não pode ser excluído. Mantenha o cadastro para preservar a rastreabilidade.','warning')}await db.providers.delete(id);await this.logAction('delete','Prestador excluído',p.name||('ID '+id));await this.load()}"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: alvo encontrado {s.count(old)} vez(es)')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v67-history-guard';"
          new="const CACHE_NAME = 'recibocondo-v68-provider-history-guard';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit da correcao e remover workflow temporario
        run: |
          rm -f .github/workflows/provider-history-guard.yml
          git config user.name "ReciboCondo Provider Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/provider-history-guard.yml
          git commit -m "Prevent deleting providers with linked history"
          git push origin HEAD:fix/transacoes-seguras-importacao