name: Corrigir duplicacao de lancamento
on:
  push:
    branches: [audit/duplicate-service]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover vinculo de recorrencia da copia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          old="async duplicateServiceInternal(s){let d={...s};delete d.id;d.status='Pendente';d.paidValue=0;d.paymentDate='';d.paymentMethod='';d.serviceDate=this.today();d.dueDate=this.today();d.reference=this.today().slice(0,7);await db.services.add(d);"
          new="async duplicateServiceInternal(s){let d={...s};delete d.id;delete d.recurrenceId;d.status='Pendente';d.paidValue=0;d.paymentDate='';d.paymentMethod='';d.serviceDate=this.today();d.dueDate=this.today();d.reference=this.today().slice(0,7);await db.services.add(d);"
          if old not in s: raise SystemExit('Rotina de duplicacao nao encontrada no formato esperado')
          s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('sw.js'); w=sw.read_text()
          w2=re.sub(r"const CACHE_NAME = 'recibocondo-v[^']+';", "const CACHE_NAME = 'recibocondo-v88-duplicate-guard';", w, count=1)
          if w2==w: raise SystemExit('Cache nao atualizado')
          sw.write_text(w2)
          out=p.read_text()
          if "delete d.recurrenceId" not in out: raise SystemExit('Protecao nao aplicada')
          PY
      - name: Commit
        run: |
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Detach duplicated services from recurrence origin' || exit 0
          git push