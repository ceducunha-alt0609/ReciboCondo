name: v122 empty first-run settings
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v122-audit-settings-defaults.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove demo condo defaults without touching saved settings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="settings:{condoName:'Condomínio Exemplo',cnpj:'CNPJ 00.000.000/0001-00',address:'Endereço do condomínio',manager:'Síndico/Tesoureiro',logo:''}"
          new="settings:{condoName:'',cnpj:'',address:'',manager:'',logo:''}"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          assert "Condomínio Exemplo" not in s
          assert "CNPJ 00.000.000/0001-00" not in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v122-empty-first-run-settings'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v122-audit-settings-defaults.yml v122-settings-defaults-audit.txt
          git commit -m 'v122: remove demo condo defaults'
          git push
