name: Inspecionar exclusao de prestador
on:
  push:
    branches: [audit/provider-delete-guard]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair rotinas de exclusao de prestador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['openDeleteProviderModal','deleteProviderInternal','db.providers.delete','providerAction(action,p)','providerId===','providerId)===Number']
          out=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append('\n===== '+term+' @ '+str(i)+' =====\n'+s[max(0,i-1800):i+4200])
                  pos=i+len(term)
          Path('provider-delete-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Provider Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add provider-delete-inspection.txt
          git commit -m 'Inspect provider deletion safeguards' || exit 0
          git push
