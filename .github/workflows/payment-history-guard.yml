name: Blindar exclusao de pagamento

on:
  push:
    branches: [fix/payment-history-guard]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-history-guard
      - name: Preservar lancamento ao excluir pagamento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_func="async removePaymentInternal(id){let s=this.services.find(x=>Number(x.id)===Number(id));if(!s)return;let linked=this.receipts.filter(r=>Number(r.serviceId)===Number(id));for(const r of linked){await db.receipts.delete(r.id);await this.logAction('delete','Recibo removido por exclusão de pagamento','Nº '+r.number+' • '+(r.providerName||this.providerName(s.providerId)))}await db.services.delete(id);await this.logAction('delete','Pagamento excluído',this.providerName(s.providerId)+' • '+this.money(s.paidValue||0));await this.load()}"
          new_func="async removePaymentInternal(id){let s=this.services.find(x=>Number(x.id)===Number(id));if(!s)return;let linked=this.receipts.filter(r=>Number(r.serviceId)===Number(id));await db.transaction('rw',db.receipts,db.services,async()=>{for(const r of linked)await db.receipts.delete(r.id);await db.services.update(id,{paidValue:0,paymentDate:'',paymentMethod:'',status:'Pendente'})});for(const r of linked)await this.logAction('delete','Recibo removido por exclusão de pagamento','Nº '+r.number+' • '+(r.providerName||this.providerName(s.providerId)));await this.logAction('delete','Pagamento excluído; lançamento mantido',this.providerName(s.providerId)+' • '+this.money(s.paidValue||0));await this.load()}"
          if s.count(old_func)!=1:
              raise SystemExit(f'Patch abortado: removePaymentInternal encontrado {s.count(old_func)} vez(es)')
          s=s.replace(old_func,new_func,1)

          old_note="note:receipt?'O recibo vinculado nº '+receipt.number+' também será removido para evitar divergência. A numeração não será reaproveitada.':'O lançamento/pagamento será removido do controle e não voltará como pendente.'"
          new_note="note:receipt?'O recibo vinculado nº '+receipt.number+' também será removido. O lançamento será mantido e voltará como Pendente; a numeração do recibo não será reaproveitada.':'O pagamento será removido, mas o lançamento será mantido e voltará como Pendente.'"
          if s.count(old_note)!=1:
              raise SystemExit(f'Patch abortado: aviso do pagamento encontrado {s.count(old_note)} vez(es)')
          s=s.replace(old_note,new_note,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Renovar cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE_NAME = 'recibocondo-v68-provider-history-guard';"
          new="const CACHE_NAME = 'recibocondo-v69-payment-history-guard';"
          if s.count(old)!=1:
              raise SystemExit(f'Patch abortado: cache esperado encontrado {s.count(old)} vez(es)')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit da correcao e remover workflow temporario
        run: |
          rm -f .github/workflows/payment-history-guard.yml
          git config user.name "ReciboCondo Payment Guard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/payment-history-guard.yml
          git commit -m "Preserve service history when deleting payments"
          git push origin HEAD:fix/payment-history-guard
