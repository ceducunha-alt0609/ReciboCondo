name: Auditar datas de lancamento e pagamento
on:
  push:
    branches: [audit/provider-duplicates]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['async saveService','pay(s)','async pay','paymentDate','serviceDate','dueDate','paymentForm','confirmPayment']
          out=[]
          for term in terms:
            pos=0
            while True:
              i=s.find(term,pos)
              if i<0: break
              out.append(f'===== {term} @ {i} =====\n'+s[max(0,i-1800):i+5200])
              pos=i+len(term)
          Path('date-inspection.txt').write_text('\n\n'.join(out))
          PY
          git config user.name 'ReciboCondo Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add date-inspection.txt
          git commit -m 'Inspect date validation flow' || exit 0
          git push