name: v113 inspect exact receipt methods
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v113-audit-receipt-number.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact receipt method definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['reportReceiptNumber','quickReceipt','recentPaymentReceipt','issueReceipt']:
              print('\n===== '+term+' =====')
              start=0; occ=[]
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  occ.append(i); start=i+len(term)
              print('COUNT',len(occ),'POSITIONS',occ)
              for i in occ:
                  left=max(0,i-220)
                  right=min(len(s),i+1000)
                  print('\n---',i,'---\n'+s[left:right])
          PY
