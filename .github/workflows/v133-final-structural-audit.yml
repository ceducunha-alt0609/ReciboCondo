name: v133 refine provider paid display
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v133-final-structural-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact provider display context
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needle='money(s.paidValue || s.amount)'
          assert s.count(needle)==1
          i=s.index(needle)
          Path('v133-final-structural-audit.txt').write_text(s[max(0,i-4200):i+4200],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v133-final-structural-audit.txt
          git commit -m 'v133: refine provider paid display audit'
          git push
