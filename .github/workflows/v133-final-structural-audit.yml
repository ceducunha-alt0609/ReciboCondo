name: v133 provider service amount
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v133-final-structural-audit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep provider recent services on launched amount semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='money(s.paidValue || s.amount)'
          new='money(s.amount)'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          assert old not in s
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v133-provider-service-amount'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v133-final-structural-audit.yml v133-final-structural-audit.txt
          git commit -m 'v133: align provider recent services with launched amount'
          git push
