name: v129 refine balance helper
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v129-audit-balance-ledger.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact balance helper and financial getters
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['balance(s){','balance(s) {','get totalPending','get dayOverdue','get dayDueToday','get dayNextDue','get servicePanelOpenRows','get servicePanelTotals','remaining=Math.max']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0;n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'#{n} at {i}\n{s[max(0,i-900):i+2200]}\n')
                  start=i+len(term)
              out.append(f'COUNT={n}\n')
          Path('v129-balance-ledger-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v129-balance-ledger-audit.txt
          git commit -m 'v129: refine balance helper audit'
          git push
