name: v129 local next due date
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v129-audit-balance-ledger.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep next-due boundary in local calendar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="get dayNextDue(){let t=new Date(this.today()+'T00:00:00'),limit=new Date(t);limit.setDate(t.getDate()+7);let a=this.today(),b=limit.toISOString().slice(0,10);return this.services.filter(s=>s.status!=='Pago'&&s.dueDate&&s.dueDate>a&&s.dueDate<=b).sort((x,y)=>String(x.dueDate).localeCompare(String(y.dueDate)))}"
          new="get dayNextDue(){let t=new Date(this.today()+'T00:00:00'),limit=new Date(t);limit.setDate(t.getDate()+7);let a=this.today(),b=localDateKey(limit);return this.services.filter(s=>s.status!=='Pago'&&s.dueDate&&s.dueDate>a&&s.dueDate<=b).sort((x,y)=>String(x.dueDate).localeCompare(String(y.dueDate)))}"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8'); w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v129-local-next-due'",w,count=1); assert n==1; sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v129-audit-balance-ledger.yml v129-balance-ledger-audit.txt
          git commit -m 'v129: keep next due dates on local calendar'
          git push
