name: Limpar recibo excluido da memoria
on:
  push:
    branches: [audit/provider-duplicates]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          old="await db.receipts.delete(id);await this.logAction('delete','Recibo excluído',r?('Nº '+r.number+' • '+r.providerName):('ID '+id));await this.load()"
          new="await db.receipts.delete(id);if(this.currentReceipt&&Number(this.currentReceipt.id)===Number(id))this.currentReceipt=null;await this.logAction('delete','Recibo excluído',r?('Nº '+r.number+' • '+r.providerName):('ID '+id));await this.load()"
          if old not in s: raise SystemExit('Trecho de exclusao nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('sw.js'); w=sw.read_text()
          w2=re.sub(r"const CACHE_NAME = 'recibocondo-v[^']+';", "const CACHE_NAME = 'recibocondo-v95-delete-receipt-guard';", w, count=1)
          if w2==w: raise SystemExit('Cache nao atualizado')
          sw.write_text(w2)
          if "this.currentReceipt=null" not in s: raise SystemExit('Guarda nao aplicada')
          PY
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Clear deleted current receipt from UI state' || exit 0
          git push