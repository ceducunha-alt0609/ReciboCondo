name: v101 payment ledger patch
on:
  push:
    paths:
      - '.github/workflows/v101-patch.yml'
      - 'tools/v101_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/v101_atomic_harden.py
      - run: python tools/v101_patch.py
      - name: Commit v101
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v101: preserve individual payment history"
          git push
