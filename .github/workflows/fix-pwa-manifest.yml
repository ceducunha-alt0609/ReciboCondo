name: Build ReciboCondo current PWA icon

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-manifest.yml'

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create current-brand SVG icons and update manifest
        run: |
          mkdir -p assets/icons
          cat > assets/icons/recibocondo-current.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="104" fill="#eef7f1"/>
            <g fill="none" stroke="#059669" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
              <path d="M154 430V110c0-14 11-25 25-25h154c14 0 25 11 25 25v320"/>
              <path d="M154 240h-48c-14 0-25 11-25 25v165"/>
              <path d="M358 190h48c14 0 25 11 25 25v215"/>
              <path d="M220 150h72"/>
              <path d="M220 215h72"/>
              <path d="M220 280h72"/>
              <path d="M220 345h72"/>
              <path d="M55 430h402"/>
            </g>
          </svg>
          SVG
          cp assets/icons/recibocondo-current.svg assets/icons/recibocondo-current-maskable.svg
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("manifest.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["icons"]=[
            {"src":"assets/icons/recibocondo-current.svg?v=171","sizes":"any","type":"image/svg+xml","purpose":"any"},
            {"src":"assets/icons/recibocondo-current-maskable.svg?v=171","sizes":"any","type":"image/svg+xml","purpose":"maskable"}
          ]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path("sw.js")
          s=p.read_text(encoding="utf-8")
          import re
          s=re.sub(r"const CACHE_NAME = 'recibocondo-[^']+';","const CACHE_NAME = 'recibocondo-v171-current-brand-icon';",s,1)
          if "'./assets/icons/recibocondo-current.svg'" not in s:
              s=s.replace("  './assets/icons/icon-maskable-512.png',","  './assets/icons/icon-maskable-512.png',\n  './assets/icons/recibocondo-current.svg',\n  './assets/icons/recibocondo-current-maskable.svg',")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit icon refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/recibocondo-current.svg assets/icons/recibocondo-current-maskable.svg manifest.json sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "fix: use current ReciboCondo brand icon for PWA"
          git push
