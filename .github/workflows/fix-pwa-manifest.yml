name: Inspect published ReciboCondo PWA files

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-manifest.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published PWA resources
        run: |
          set -x
          curl -sS -D - -o /tmp/manifest https://ceducunha-alt0609.github.io/ReciboCondo/manifest.json | sed -n '1,30p'
          echo "----- MANIFEST BODY -----"
          cat /tmp/manifest
          echo "----- ICON 192 HEADERS -----"
          curl -sS -I https://ceducunha-alt0609.github.io/ReciboCondo/assets/icons/recibocondo-pwa-192-v172.png
          echo "----- ICON 512 HEADERS -----"
          curl -sS -I https://ceducunha-alt0609.github.io/ReciboCondo/assets/icons/recibocondo-pwa-512-v172.png
          echo "----- INDEX FIRST 120 BYTES -----"
          curl -sS https://ceducunha-alt0609.github.io/ReciboCondo/ | head -c 120 | xxd
