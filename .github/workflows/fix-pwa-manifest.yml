name: Inspect ReciboCondo PWA manifest

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-manifest.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect manifest placement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          head_open=s.lower().find("<head")
          head_close=s.lower().find("</head>")
          matches=[m.start() for m in re.finditer(r'rel\s*=\s*["\']manifest["\']',s,re.I)]
          print("HEAD_OPEN",head_open)
          print("HEAD_CLOSE",head_close)
          print("MANIFEST_MATCHES",matches[:20])
          for pos in matches[:5]:
              print("CONTEXT",repr(s[max(0,pos-250):pos+350]))
          print("IN_REAL_HEAD", [p for p in matches if head_open <= p <= head_close])
          PY
