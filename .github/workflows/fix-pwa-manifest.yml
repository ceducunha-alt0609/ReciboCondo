name: Inspect ReciboCondo PWA head

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-manifest.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect head and registration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          head=s[s.lower().find("<head"):s.lower().find("</head>")+7]
          for pat in ["Content-Security-Policy","manifest.json","serviceWorker.register","navigator.serviceWorker","theme-color"]:
              print("\nPATTERN",pat)
              for m in re.finditer(re.escape(pat),s,re.I):
                  print("POS",m.start(),repr(s[max(0,m.start()-300):m.start()+500]))
          print("\nHEAD_FIRST_2500\n",head[:2500])
          PY
