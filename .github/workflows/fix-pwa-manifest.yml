name: Fix ReciboCondo PWA manifest

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-manifest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert manifest link in index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if 'rel="manifest"' not in s and "rel='manifest'" not in s:
              marker = "</head>"
              if marker not in s:
                  raise SystemExit("No </head> found")
              injection = '  <link rel="manifest" href="./manifest.json">\n  <meta name="theme-color" content="#0F2A3A">\n'
              s = s.replace(marker, injection + marker, 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "Manifest link already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: add PWA manifest link to index"
          git push
