name: Inspect ReciboCondo current brand icon

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-manifest.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find header brand icon
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          terms=["ReciboCondo","building-2","building","landmark"]
          for term in terms:
              print("\nTERM",term)
              start=0
              shown=0
              while shown<8:
                  i=s.find(term,start)
                  if i<0: break
                  print("POS",i,repr(s[max(0,i-350):i+500]))
                  start=i+len(term)
                  shown+=1
          PY
