name: v101 inspect payment paths
on:
  push:
    paths:
      - '.github/workflows/v101-inspect.yml'
      - 'tools/v101_inspect.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/v101_inspect.py
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/v101_inspection.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate temporary v101 payment inspection"
          git push
