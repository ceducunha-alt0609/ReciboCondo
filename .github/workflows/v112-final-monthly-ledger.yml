name: v112 final monthly payment ledger
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v112-final-monthly-ledger.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch monthly recent payments to ledger events
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')

          old_get="get servicePanelPaidRows(){return this.servicePanelRows.filter(s=>Number(s.paidValue||0)>0).sort((a,b)=>String(b.paymentDate||b.serviceDate).localeCompare(String(a.paymentDate||a.serviceDate)))},"
          assert s.count(old_get)==1, f'getter count={s.count(old_get)}'
          new_get=old_get+"\n  get servicePanelPaymentEvents(){let ref=this.servicePanelMonth;return this.payments.map(p=>{let service=this.services.find(s=>Number(s.id)===Number(p.serviceId))||null,receipt=p.receiptId?this.receipts.find(r=>Number(r.id)===Number(p.receiptId)):null;return{...p,paymentDate:p.date||'',paymentMethod:p.method||'',paidValue:Number(p.amount||0),service,receipt}}).filter(p=>String(p.date||'').slice(0,7)===ref).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.id||0)-Number(a.id||0))},"
          s=s.replace(old_get,new_get,1)

          start=s.find('<template x-for="s in servicePanelPaidRows.slice(0,5)" :key="s.id">')
          assert start>=0, 'panel template start not found'
          end=s.find('</template>',start)
          assert end>=0, 'panel template end not found'
          end+=len('</template>')
          old_block=s[start:end]
          for required in ['fmt(s.paymentDate)','money(s.paidValue||0)','quickReceipt(s)']:
              assert required in old_block, f'missing {required}'
          new_block='''<template x-for="p in servicePanelPaymentEvents.slice(0,5)" :key="'panel-pay-'+p.id">
                    <div class="flex items-center justify-between gap-3 rounded-2xl bg-white/70 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/60 p-2">
                      <div><p class="font-black text-sm" x-text="providerName(p.providerId)"></p><p class="text-xs text-slate-500" x-text="fmt(p.date)+' • '+(p.service?.category||'Sem categoria')+' • '+(p.method||'forma não informada')"></p></div>
                      <div class="text-right"><p class="font-black text-emerald-700" x-text="money(p.amount||0)"></p><button @click="recentPaymentReceipt(p)" class="mini" :disabled="isViewer || !p.service" x-text="p.receipt?'Ver recibo':'Emitir recibo'"></button></div>
                    </div>
                  </template>'''
          s=s[:start]+new_block+s[end:]

          empty='x-show="!servicePanelPaidRows.length" class="text-sm text-slate-500 text-center py-3">Nenhum pagamento registrado neste mês.</p>'
          assert s.count(empty)==1, f'empty count={s.count(empty)}'
          s=s.replace(empty,'x-show="!servicePanelPaymentEvents.length" class="text-sm text-slate-500 text-center py-3">Nenhum pagamento registrado neste mês.</p>',1)

          assert s.count('get servicePanelPaymentEvents(){')==1
          assert 'servicePanelPaymentEvents.slice(0,5)' in s
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8')
          w,n=re.subn(r"const CACHE_NAME = '[^']+'","const CACHE_NAME = 'recibocondo-v112-monthly-payment-ledger'",w,count=1)
          assert n==1
          sw.write_text(w,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/v112-final-monthly-ledger.yml
          git commit -m 'v112: show monthly payments from ledger'
          git push
