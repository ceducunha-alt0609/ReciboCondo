name: Inspecionar busca e filtros multi-recibo
on:
  push:
    branches: [audit/search-filters-multireceipt]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/search-filters-multireceipt
      - name: Ajustar ordenacao e avisos multi-recibo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="get reportRows(){return this.services.filter(s=>(!this.report.from||s.serviceDate>=this.report.from)&&(!this.report.to||s.serviceDate<=this.report.to)&&(this.report.category==='todas'||s.category===this.report.category)&&(this.report.status==='todos'||s.status===this.report.status)).sort((a,b)=>{let ra=this.receipts.find(x=>Number(x.serviceId)===Number(a.id));let rb=this.receipts.find(x=>Number(x.serviceId)===Number(b.id));let na=Number(String(ra?.number||'0').replace(/\\D/g,''))||0;let nb=Number(String(rb?.number||'0').replace(/\\D/g,''))||0;return na-nb;})}"
          new="get reportRows(){return this.services.filter(s=>(!this.report.from||s.serviceDate>=this.report.from)&&(!this.report.to||s.serviceDate<=this.report.to)&&(this.report.category==='todas'||s.category===this.report.category)&&(this.report.status==='todos'||s.status===this.report.status)).sort((a,b)=>{let nums=x=>this.receipts.filter(r=>Number(r.serviceId)===Number(x.id)).map(r=>Number(String(r.number||'').replace(/\\D/g,''))||0).filter(Boolean),aa=nums(a),bb=nums(b),na=aa.length?Math.min(...aa):0,nb=bb.length?Math.min(...bb):0;if(na&&nb&&na!==nb)return na-nb;if(na&&!nb)return-1;if(!na&&nb)return 1;return String(a.serviceDate||'').localeCompare(String(b.serviceDate||''))||Number(a.id||0)-Number(b.id||0)})}"
          if s.count(old)!=1: raise SystemExit('reportRows esperado nao encontrado exatamente uma vez')
          s=s.replace(old,new,1)
          old2="if(linked||Number(s.paidValue||0)>0)return this.toast(linked?'Este lançamento possui o recibo nº '+linked.number+'. Exclua pelo fluxo de pagamento/recibo para preservar o histórico.':'Este lançamento possui pagamento registrado. Exclua pelo fluxo de pagamentos para preservar o histórico.','warning');"
          new2="if(linked||Number(s.paidValue||0)>0){let linkedCount=this.receipts.filter(r=>Number(r.serviceId)===Number(id)).length;return this.toast(linkedCount>1?'Este lançamento possui '+linkedCount+' recibos vinculados. Exclua pelo fluxo de pagamentos/recibos para preservar o histórico.':linked?'Este lançamento possui o recibo nº '+linked.number+'. Exclua pelo fluxo de pagamento/recibo para preservar o histórico.':'Este lançamento possui pagamento registrado. Exclua pelo fluxo de pagamentos para preservar o histórico.','warning')}"
          if s.count(old2)!=1: raise SystemExit('aviso esperado nao encontrado exatamente uma vez')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Renovar cache e validar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js'); s=p.read_text()
          m=re.search(r"const CACHE_NAME = 'recibocondo-v(\d+)-[^']+';",s)
          if not m: raise SystemExit('cache nao encontrado')
          n=int(m.group(1))+1
          p.write_text(re.sub(r"const CACHE_NAME = 'recibocondo-v\d+-[^']+';",f"const CACHE_NAME = 'recibocondo-v{n}-multireceipt-search';",s,count=1))
          s2=Path('index.html').read_text()
          assert 'let nums=x=>this.receipts.filter' in s2
          assert "linkedCount>1?'Este lançamento possui '" in s2
          PY
      - name: Limpar temporarios e commit final
        run: |
          rm -f .github/workflows/inspect-search-filters.yml .github/workflows/fix-search-filter-assumptions.yml search-filter-inspection.txt
          git config user.name 'ReciboCondo Multi Receipt Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining single-receipt assumptions from reports'
          git push origin HEAD:audit/search-filters-multireceipt