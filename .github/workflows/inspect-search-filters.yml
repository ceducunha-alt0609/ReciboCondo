name: Inspecionar busca e filtros multi-recibo
on:
  push:
    branches: [audit/search-filters-multireceipt]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair rotinas de busca e filtros
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['globalSearch','filteredReceipts','receiptFilter','receiptSearch','openReceipt','currentReceipt','receiptByService','serviceId)===Number','receipts.find','receipts.filter','get receipts','get filtered']
          out=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  out.append('\n===== '+term+' @ '+str(i)+' =====\n'+s[max(0,i-1400):i+3200])
                  pos=i+len(term)
          Path('search-filter-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Search Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add search-filter-inspection.txt
          git commit -m 'Inspect search and receipt filtering assumptions'
          git push