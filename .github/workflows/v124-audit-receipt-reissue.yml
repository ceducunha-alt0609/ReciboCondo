name: v124 audit receipt reissue
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v124-audit-receipt-reissue.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture receipt deletion and reissue flow
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['async removeReceiptInternal(id)','async issueReceipt(paymentId=null)','async recentPaymentReceipt(p)','quickReceipt(s)','receiptPending(service)','receiptActionLabel(service)']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0;n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'\n--- occurrence {n} at {i} ---\n')
                  out.append(s[max(0,i-1800):i+5200])
                  start=i+len(term)
              out.append(f'\nCOUNT={n}\n')
          Path('v124-receipt-reissue-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v124-receipt-reissue-audit.txt
          git commit -m 'v124: capture receipt reissue audit'
          git push
