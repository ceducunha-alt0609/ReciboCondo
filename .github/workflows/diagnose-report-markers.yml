name: Diagnosticar marcadores do relatorio
on:
  push:
    branches: [fix/report-multiple-receipts]
permissions:
  contents: write
jobs:
  diag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-multiple-receipts
      - name: Diagnostico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          pats=[
            'get reportRows(){','get reportTotals(){','get reportDetailRows(){',
            '<section x-show="view===\'relatorios\'"','<div class="glass rounded-3xl p-4 overflow-auto scrollbar">',
            'x-for="s in reportRows" :key="s.id"','x-text="reportReceiptNumber(s)"',
            'x-text="money(s.paidValue||0)"','x-text="reportRows.length"',
            '<table class="report-table mb-5">','x-text="money(s.paidValue || s.amount)"',
            "this.reportRows.map(s=>[s.serviceDate,s.paymentDate||'',this.providerName(s.providerId),s.category,s.description,s.amount,s.paidValue||0,s.status])"
          ]
          out=[]
          for p in pats: out.append(str(s.count(p))+' | '+p)
          Path('report-marker-diagnostics.txt').write_text('\n'.join(out))
          PY
      - name: Commit
        run: |
          git config user.name 'ReciboCondo Marker Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add report-marker-diagnostics.txt
          git commit -m 'Diagnose report patch markers'
          git push