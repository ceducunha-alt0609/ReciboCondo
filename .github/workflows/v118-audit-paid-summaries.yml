name: v118 audit paid summaries
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v118-audit-paid-summaries.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture paid summary semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['paidValue||s.amount','paidValue || s.amount','topProviders','categorySummary','annualTopProviders','annualCategorySummary','Maior categoria','Top recebimentos']
          out=[]
          for term in terms:
              out.append('\n===== '+term+' =====\n')
              start=0;n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f'\n--- occurrence {n} at {i} ---\n')
                  out.append(s[max(0,i-1600):i+4200])
                  start=i+len(term)
              out.append(f'\nCOUNT={n}\n')
          Path('v118-paid-summaries-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v118-paid-summaries-audit.txt
          git commit -m 'v118: capture paid summary semantics audit'
          git push
