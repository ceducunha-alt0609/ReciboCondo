name: v123 audit top-level duplicate members
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v123-audit-duplicate-members.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture only top-level app object members
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          s=Path('index.html').read_text(encoding='utf-8')
          marker='function app(){return{'
          root=s.index(marker)+len(marker)
          # Split only on commas that belong to the root app object.
          parts=[]; start=root; brace=1; bracket=0; paren=0; i=root
          quote=None; esc=False; line_comment=False; block_comment=False
          while i<len(s):
            c=s[i]; n=s[i+1] if i+1<len(s) else ''
            if line_comment:
              if c=='\n': line_comment=False
              i+=1; continue
            if block_comment:
              if c=='*' and n=='/': block_comment=False; i+=2; continue
              i+=1; continue
            if quote:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c==quote: quote=None
              i+=1; continue
            if c in "'\"`": quote=c; i+=1; continue
            if c=='/' and n=='/': line_comment=True; i+=2; continue
            if c=='/' and n=='*': block_comment=True; i+=2; continue
            if c=='{': brace+=1
            elif c=='}':
              brace-=1
              if brace==0:
                parts.append((start,i,s[start:i]))
                break
            elif c=='[': bracket+=1
            elif c==']': bracket-=1
            elif c=='(': paren+=1
            elif c==')': paren-=1
            elif c==',' and brace==1 and bracket==0 and paren==0:
              parts.append((start,i,s[start:i])); start=i+1
            i+=1
          byname=collections.defaultdict(list)
          rx=re.compile(r'^\s*(?:(get|async)\s+)?([A-Za-z_$][\w$]*)\s*(?=[:(])')
          for a,b,text in parts:
            m=rx.match(text)
            if not m: continue
            kind=m.group(1) or ('method' if '(' in text[:max(80,m.end()+30)] else 'property')
            name=m.group(2)
            byname[name].append((kind,a,text[:500]))
          dups={k:v for k,v in byname.items() if len(v)>1}
          out=[f'TOP_LEVEL_MEMBERS={sum(len(v) for v in byname.values())}\n',f'DUPLICATE_NAMES={len(dups)}\n']
          for name,vals in sorted(dups.items()):
            out.append(f'\n===== {name} ({len(vals)}) =====\n')
            for kind,pos,_ in vals:
              out.append(f'\n--- {kind} at {pos} ---\n')
              out.append(s[max(root,pos-700):pos+1900])
          Path('v123-duplicate-members-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v123-duplicate-members-audit.txt
          git commit -m 'v123: refine top-level duplicate member audit'
          git push
