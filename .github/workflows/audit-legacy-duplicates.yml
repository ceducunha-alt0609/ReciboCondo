name: Inspecionar recibos legados duplicados
on:
  push:
    branches: [audit/receipt-seq-reset]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/receipt-seq-reset
      - name: Detalhar duplicados
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/data/excel_legacy_import.json').read_text())
          targets={'201651','201807','201817','201846'}
          services={str(s.get('legacyReceipt','')):[] for s in d.get('services',[])}
          for s in d.get('services',[]): services.setdefault(str(s.get('legacyReceipt','')),[]).append(s)
          out=[]
          for n in sorted(targets):
              out.append('===== '+n+' =====')
              rs=[r for r in d.get('receipts',[]) if str(r.get('number',''))==n]
              ss=[s for s in d.get('services',[]) if str(s.get('legacyReceipt',''))==n]
              out.append('RECEIPTS '+str(len(rs)))
              for r in rs: out.append(json.dumps(r,ensure_ascii=False,sort_keys=True))
              out.append('SERVICES '+str(len(ss)))
              for s in ss: out.append(json.dumps(s,ensure_ascii=False,sort_keys=True))
          Path('legacy-duplicate-details.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostico
        run: |
          git config user.name 'ReciboCondo Legacy Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add legacy-duplicate-details.txt
          git commit -m 'Inspect duplicate legacy receipt numbers'
          git push