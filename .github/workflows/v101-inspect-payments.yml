name: cleanup temporary v104 workflow

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v101-inspect-payments.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v101-inspect-payments.yml
          git commit -m 'Remove temporary v104 workflow'
          git push
