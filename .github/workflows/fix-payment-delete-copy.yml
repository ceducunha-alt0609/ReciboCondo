name: Ajustar aviso de exclusao de pagamentos
on:
  push:
    branches: [fix/payment-delete-multiple-receipts-copy]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar modal e cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          start=s.find("openDeletePaymentModal(s){")
          end=s.find("openDeleteReceiptModal(r){", start)
          if start<0 or end<0: raise SystemExit('Marcadores do modal nao encontrados')
          new="""openDeletePaymentModal(s){if(this.isViewer)return;let linked=this.receipts.filter(r=>Number(r.serviceId)===Number(s.id)),numbers=linked.map(r=>r.number).filter(Boolean),receiptText=linked.length===1?'O recibo vinculado nº '+numbers[0]+' também será removido.':linked.length>1?linked.length+' recibos vinculados também serão removidos: '+numbers.join(', ')+'.':'O pagamento será removido, mas o lançamento será mantido e voltará como Pendente.';this.actionModal={open:true,type:'deletePayment',tone:'danger',icon:'circle-x',target:s,service:s,title:'Excluir todos os pagamentos',subtitle:'Essa ação zera todo o valor pago deste lançamento.',note:linked.length?receiptText+' O lançamento será mantido e voltará como Pendente; a numeração dos recibos não será reaproveitada.':receiptText,confirmLabel:'Excluir pagamentos',details:[{label:'Prestador',value:this.providerName(s.providerId)},{label:'Valor pago',value:this.money(s.paidValue||0)},{label:'Data/forma',value:(s.paymentDate?this.fmt(s.paymentDate):'-')+' • '+(s.paymentMethod||'não informada')},{label:'Recibos vinculados',value:linked.length?(numbers.join(', ')||linked.length+' recibo(s)'):'não emitido'}]};this.after()},"""
          s=s[:start]+new+s[end:]
          if "linked=this.receipts.filter(r=>Number(r.serviceId)===Number(s.id))" not in s: raise SystemExit('Validacao do modal falhou')
          p.write_text(s)
          sw=Path('sw.js'); w=sw.read_text()
          import re
          w2=re.sub(r"const CACHE_NAME = 'recibocondo-v[^']+';", "const CACHE_NAME = 'recibocondo-v86-payment-delete-copy';", w, count=1)
          if w2==w: raise SystemExit('Cache nao atualizado')
          sw.write_text(w2)
          PY
      - name: Commit
        run: |
          git config user.name 'ReciboCondo Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Clarify deletion of multiple payment receipts' || exit 0
          git push
