name: v134 explicit receipt button
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v134-audit-future-receipt.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix direct receipt button call
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          old='@click="issueReceipt" class="primary w-full"'
          new='@click="issueReceipt()" class="primary w-full"'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          Path('index.html').write_text(s,encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          import re
          sw=re.sub(r"recibocondo-v\d+(?:-[A-Za-z0-9-]+)?","recibocondo-v134-explicit-receipt-call",sw,count=1)
          Path('sw.js').write_text(sw,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'v134: fix direct receipt issuance button'
          git rm .github/workflows/v134-audit-future-receipt.yml
          git rm v134-future-receipt-audit.txt
          git commit -m 'Remove temporary v134 audit files'
          git push
