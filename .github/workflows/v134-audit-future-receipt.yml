name: v134 refine receipt eligibility
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v134-audit-future-receipt.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact receipt functions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for name,next_name in [('async quickReceipt(s){','async issueReceipt('),('async issueReceipt(','async removeReceiptInternal(')]:
              i=s.index(name)
              j=s.find(next_name,i+len(name))
              if j<0:j=i+7000
              out.append('\n=== '+name+' ===\n'+s[i:j]+'\n')
          Path('v134-future-receipt-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v134-future-receipt-audit.txt
          git commit -m 'v134: refine receipt eligibility audit'
          git push
