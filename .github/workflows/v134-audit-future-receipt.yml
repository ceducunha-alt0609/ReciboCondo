name: v134 audit future receipt
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v134-audit-future-receipt.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect receipt eligibility and future date guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['quickReceipt(','issueReceipt(','receiptPending(','Recibo não disponível','recibo não disponível','today()','payment.date','paymentDate']
          out=[]
          for term in terms:
              poss=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
              out.append(f'\n=== {term} count={len(poss)} ===\n')
              for i in poss[:15]: out.append(s[max(0,i-1200):i+2200]+'\n---\n')
          Path('v134-future-receipt-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v134-future-receipt-audit.txt
          git commit -m 'v134: capture future receipt audit'
          git push
