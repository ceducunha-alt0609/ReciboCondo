name: v134 inspect recent payment getter
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v134-audit-future-receipt.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture paymentRecent and servicePanelPaymentEvents getters
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for needle in ['get paymentRecent(){','get servicePanelPaymentEvents(){']:
              i=s.find(needle)
              out.append('\n=== '+needle+' at '+str(i)+' ===\n')
              if i>=0: out.append(s[i:i+5000]+'\n')
          Path('v134-future-receipt-audit.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v134-future-receipt-audit.txt
          git commit -m 'v134: inspect recent payment getter'
          git push
